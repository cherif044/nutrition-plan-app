# Prometheus-style alert rules for the Grafana Cloud metrics data source.
# Create them in the Grafana UI (see README.md), or load them with:
#   mimirtool rules load observability/grafana/alerts.yaml --address=<prom url> --id=<instance id> --key=<token>
namespace: nutrition-plan-app
groups:
  - name: nutrition-plan-app
    interval: 1m
    rules:
      - alert: HighServerErrorRate
        # More than 5% of requests failing, and at least 3 failures, so one
        # error during a quiet period does not page anyone.
        expr: |
          (
            sum(rate(nutrition_http_requests_total{status_class="5xx"}[5m]))
            / sum(rate(nutrition_http_requests_total[5m]))
          ) > 0.05
          and sum(increase(nutrition_http_requests_total{status_class="5xx"}[5m])) >= 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than 5% of requests are returning 5xx errors.
          description: Check the "Errors and warnings" logs panel on the Nutrition Plan dashboard.

      - alert: SlowApiLatency
        # Plan generation and PDF export are slow by design and excluded.
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(nutrition_http_request_duration_seconds_bucket{route!~"/api/generate-plan|/api/plans/:id/export.pdf|/metrics|/api/vitals"}[5m]))) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency has been above 3 seconds for 10 minutes.
          description: Check the "p95 latency by route" and "Database" panels to find the slow part.
