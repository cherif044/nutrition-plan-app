<title>Macrospace</title>
<style>
:root{

  --primary:#0B0E14; --primary-hover:#232833; --primary-soft:#ECF7DA; --on-primary:#FFFFFF; --accent:#5E9C00;
  --hl:#6D5DF6; --hl-soft:#EEEBFF; --hl-ink:#4B3FD1;
  --protein:#0E8FD6; --carbs:#D99A0B; --fat:#D6408B;
  --success:#12A06A; --success-soft:#E2F5EC; --warning:#E0701B; --warning-soft:#FCEBDD; --error:#E0404A; --error-soft:#FBE3E4;

  --shadow-2:0 12px 32px -12px rgba(11,14,20,.22),0 2px 6px rgba(11,14,20,.05);

  --ui:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --display:'Geist',ui-sans-serif,system-ui,sans-serif;
  --logo-tile:#0B0E14; --logo-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}

  --text:#E8ECF2; --text-2:#98A2B0; --text-3:#5F6977;

}}
:root[data-theme="dark"]{
  --bg:#07090D; --surface:#0D1117; --subtle:#141A22; --sunken:#0A0E13; --border:#1C232D; --border-strong:#2A3340;

  --primary:#B6F23A; --primary-hover:#C9FF5C; --primary-soft:#18210C; --on-primary:#07090D; --accent:#B6F23A;
  --hl:#8B7CFF; --hl-soft:#1B1736; --hl-ink:#B4AAFF;
  --protein:#5CC8FF; --carbs:#F5C451; --fat:#F472B6;
  --success:#3DDC97; --success-soft:#0E2A1F; --warning:#FF8A3D; --warning-soft:#2E1B0E; --error:#FF5A5F; --error-soft:#2E1214;

}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.display{font-family:var(--display);letter-spacing:-.045em;font-weight:600}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.muted{color:var(--text-3)} .t2{color:var(--text-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:16px;height:16px;flex:none}

/* Buttons */
.btn{height:36px;padding:0 14px;border-radius:8px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s,transform .08s;text-decoration:none!important}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-secondary:hover{background:var(--subtle)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--subtle);color:var(--text)}
.btn-lg{height:46px;padding:0 20px;font-size:15px;border-radius:10px}
.btn-sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px;gap:6px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:7px;color:var(--text-3);background:none;border:0;cursor:pointer;transition:background .12s,color .12s}
.iconbtn:hover{background:var(--subtle);color:var(--text)}
.iconbtn.on{color:var(--hl-ink)}
.iconbtn[disabled]{opacity:.35;pointer-events:none}
kbd{font-family:var(--ui);font-size:11px;font-weight:500;padding:1px 5px;border-radius:4px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2)}

/* Inputs */
.input,select.input,textarea.input{height:36px;border:1px solid var(--border-strong);border-radius:8px;padding:0 10px;background:var(--surface);color:var(--text);font:inherit;width:100%;transition:border-color .12s,box-shadow .12s}
textarea.input{height:auto;min-height:76px;padding:8px 10px;resize:vertical}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input.err{border-color:var(--error)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:500;color:var(--text-2)}
.hint{font-size:12px;color:var(--text-3)} .errmsg{font-size:12px;color:var(--error)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.seg{display:inline-flex;background:var(--subtle);padding:3px;border-radius:9px;gap:2px;flex-wrap:wrap}
.seg button{height:30px;padding:0 12px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--text-2);font-size:13px;font-weight:500}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--text-2)}
.chip:hover{border-color:var(--text-3)}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:500}
.tag{height:26px;padding:0 4px 0 10px;border-radius:999px;background:var(--subtle);font-size:13px;display:inline-flex;align-items:center;gap:2px}
.tag button{width:20px;height:20px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--text-3)}
.tag button:hover{background:var(--sunken);color:var(--text)}
.tag .ic{width:12px;height:12px}
.chipin{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-2);z-index:30;padding:4px;display:none}
.sugg.show{display:block}
.sugg button{display:flex;width:100%;text-align:left;padding:7px 10px;border:0;background:none;border-radius:6px;cursor:pointer;justify-content:space-between;font-size:13px}
.sugg button:hover,.sugg button:first-child{background:var(--subtle)}

/* Badges & status */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--subtle);color:var(--text-2)}
.badge.draft{background:var(--hl-soft);color:var(--hl-ink)}
.badge.approved{background:var(--success-soft);color:var(--success)}
.badge.ongoing{background:var(--success-soft);color:var(--success)}
.badge.expired{background:var(--warning-soft);color:var(--warning)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{display:block;padding:20px 22px;text-decoration:none!important;color:var(--text)!important;transition:border-color .12s,background .12s}
.kpi:hover{border-color:var(--border-strong);background:var(--subtle)}
.kpi .k{font-size:13px;color:var(--text-3);display:flex;justify-content:space-between;align-items:center}
.kpi .v{font:500 40px/1.1 var(--mono);letter-spacing:-.03em;margin-top:10px}
.kpi .s{font-size:13px;color:var(--text-2);margin-top:6px}
.home-plans{margin-top:28px}
.grp-sec+.grp-sec{margin-top:28px}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.folder{display:flex;align-items:center;gap:14px;padding:18px 20px;color:var(--text)!important;text-decoration:none!important;transition:border-color .12s,background .12s}
.folder:hover{border-color:var(--border-strong);background:var(--subtle)}
.folder-ic{width:40px;height:40px;border-radius:10px;background:var(--subtle);border:1px solid var(--border);display:grid;place-items:center;flex:none;color:var(--text-2)}
.folder-ic .ic{width:20px;height:20px}
.folder>div{flex:1;min-width:0}
.folder-t{font-size:15px;font-weight:600}
.folder-s{font-size:13px;color:var(--text-3);margin-top:2px}
.folder-go{color:var(--text-3)}
.pcards{display:flex;flex-direction:column;gap:16px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.ptab{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:0;background:none;color:var(--text-3);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptab:hover{color:var(--text)}
.ptab.on{color:var(--text);border-bottom-color:var(--primary)}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--success)}
.pdot.expired{background:var(--warning)}
.pcard{overflow:hidden}
.pcard-h{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--border)}
.pcard-h>div:first-child{flex:1}
.pcard-t{font-size:16px;font-weight:600;color:var(--text)!important}
.pcard-a{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.pday{font-size:12px;font-weight:500;color:var(--text-3);padding:12px 20px 0}
.pmeals{padding:4px 0 6px}
.pmeal{display:grid;grid-template-columns:130px minmax(0,1fr) 90px 50px;gap:12px;align-items:baseline;padding:9px 20px}
.pmeal+.pmeal{border-top:1px solid var(--border)}
.pm-slot{font-size:13px;color:var(--text-3)}
.pm-name{font-weight:500;min-width:0}
.pm-ingr{display:block;font-size:12px;color:var(--text-3);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pm-k,.pm-p{text-align:right;font-size:13px}
.pm-p{color:var(--text-3)}
@media (max-width:760px){.pcard-h{flex-wrap:wrap;padding:16px}.pcard-h>div:first-child{flex:1 1 100%}.pcard-a{justify-content:flex-start}.pm-p{display:none}.pday{padding-left:16px}.pmeal{grid-template-columns:minmax(0,1fr) auto;padding:10px 16px}.pm-slot{grid-column:1/-1}}
.plans-t{table-layout:fixed}
.plans-t th:nth-child(1){width:34%}.plans-t th:nth-child(2){width:22%}.plans-t th:nth-child(3){width:14%}.plans-t th:nth-child(4){width:20%}.plans-t th:nth-child(5){width:10%}
@media (max-width:760px){.plans-t,.table.fixed{table-layout:auto}.plans-t th,.table.fixed th{width:auto!important}}
.grp-sec .section-t{justify-content:flex-start;gap:8px}
.table.fixed{table-layout:fixed}
.table.fixed th:nth-child(1){width:30%}.table.fixed th:nth-child(2){width:16%}.table.fixed th:nth-child(3){width:16%}.table.fixed th:nth-child(5){width:14%}
.home-plans .section-t{align-items:center;gap:12px;flex-wrap:wrap}
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:30px}}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--success)}
.sdot.near{background:var(--warning)} .sdot.off{background:var(--error)}

/* Shell */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;padding:18px 12px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.04em;color:var(--text);text-decoration:none!important}
.side .btn{margin:0 4px 14px;justify-content:flex-start}
.nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:var(--text-2);font-weight:500;text-decoration:none}
.nav a:hover{background:var(--subtle);color:var(--text)}
.nav a.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.nav a .cnt{margin-left:auto;font-size:12px;color:var(--text-3)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;font-size:13px}
.side-foot a{color:var(--text-3);padding:6px 10px;border-radius:6px}
.side-foot a:hover{color:var(--text);background:var(--subtle);text-decoration:none}
.page{max-width:1120px;margin:0 auto;padding:36px 36px 96px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.page-h h1{font-family:var(--display);font-size:30px;letter-spacing:-.04em;line-height:1.1;font-weight:600}
.page-h p{color:var(--text-2);margin-top:6px}
.section-t{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.section-t a{font-size:13px;font-weight:500}
.box{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--text-3);font-size:13px;margin-bottom:10px}
.crumb:hover{color:var(--text)}

/* Tables */
.table{width:100%;border-collapse:collapse}
.table th{font-size:12px;font-weight:500;color:var(--text-3);text-align:left;padding:10px 16px;border-bottom:1px solid var(--border)}
.table td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr{cursor:pointer;transition:background .1s}
.table tbody tr:hover{background:var(--subtle)}
.table .r{text-align:right}
/* Data tables: one pattern for every table */
:root{--mx-p:#3F7A00;--mx-c:#B6F23A;--mx-f:#F2B33D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mx-p:#6FAE1E}}
:root[data-theme="dark"]{--mx-p:#6FAE1E}
.dt{table-layout:fixed;width:100%}
.dt th{padding:11px 20px;background:var(--subtle);font-size:12px;font-weight:500;color:var(--text-3);text-align:left;white-space:nowrap}
.dt td{padding:0 20px;height:64px;vertical-align:middle;white-space:nowrap}
.dt tbody tr:hover{background:var(--subtle)}
.dt .r{text-align:right}
.dt .who{display:flex;align-items:center;gap:12px;min-width:0}
.dt .who>div{min-width:0}
.dt .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.dt .hint{font-size:12px;overflow:hidden;text-overflow:ellipsis}
.dt .av,.dt .tile{width:32px;height:32px;border-radius:9px;font-size:11px;flex:none}
.dt .tile{display:grid;place-items:center;background:var(--primary-soft);color:var(--accent)}
.dt .tile .ic{width:16px;height:16px}
.dt .na{color:var(--text-3)}
.dt .unit{color:var(--text-3);font-size:12px}
.st{display:inline-flex;align-items:center;gap:6px;color:var(--text-2)}
.st i{width:7px;height:7px;border-radius:50%;background:var(--success);flex:none}
.st.expired{color:var(--warning)}.st.expired i{background:var(--warning)}
.act{display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.adots{display:inline-flex;gap:3px}.adots i{width:8px;height:8px;border-radius:50%;background:var(--border-strong)}.adots i.on{background:#86BF1F}
.show-s{display:none}.show-s-i{display:none}
@media (max-width:760px){
  .show-s-i{display:inline}
  .dt th,.dt td{padding-left:14px;padding-right:14px}
  .dt td{height:auto;padding-top:12px;padding-bottom:12px}
  .dt th:first-child{width:auto!important}
  .dt .act{flex-direction:column;align-items:flex-start;gap:3px}
  .dt .act-l{font-size:11px;color:var(--text-3)}
  .show-s{display:block}
}

/* Plan folder table */
.plans-t th:nth-child(1){width:38%}.plans-t th:last-child{width:110px}
@media (max-width:760px){.plans-t th:last-child{width:90px}}

.cltab th:nth-child(1){width:36%}.cltab th:nth-child(2),.cltab th:nth-child(3),.cltab th:nth-child(4){width:14%}
@media (max-width:760px){.cltab th:nth-child(5){width:96px}}
.bt th:nth-child(1){width:30%}.bt th:nth-child(2){width:24%}.bt th:nth-child(3){width:16%}
.mx{max-width:300px}
.mx-k{font-size:12px;color:var(--text-3)}.mx-k b{font-size:15px;color:var(--text);font-weight:600;margin-right:2px}
.mx-bar{display:flex;gap:2px;height:7px;border-radius:4px;overflow:hidden;margin:5px 0}
.mx-bar i{display:block;height:100%;transform-origin:left;animation:mxgrow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.mx-g{display:flex;gap:12px;font-size:11px;color:var(--text-2);white-space:nowrap}
.mx-g span{display:inline-flex;align-items:center;gap:5px}
.mx-g b{font-weight:600;color:var(--text)}
.mx-g .show-s-i{display:none}
.mx-g i{width:8px;height:8px;border-radius:2px;flex:none}
.mx-p{background:var(--mx-p)}.mx-c{background:var(--mx-c)}.mx-f{background:var(--mx-f)}
.adots i.on{animation:dotpop .35s ease-out both;animation-delay:var(--d,0ms)}
@keyframes mxgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dotpop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.mx-bar i,.adots i.on{animation:none}}
@media (max-width:760px){.bt th:nth-child(4){width:48%}.mx-g{gap:7px;font-size:10px}.mx-g i{width:6px;height:6px}.mx-g .mx-w{display:none}.mx-g .show-s-i{display:inline}.bt-mc .adots{margin-right:6px;vertical-align:1px}.bt .tile{display:none}.bt .who{gap:0}}

/* Client profile */
.cp-h{display:flex;align-items:center;gap:16px;margin:4px 0 24px}
.cp-av{width:56px!important;height:56px!important;border-radius:14px!important;font-size:18px!important}
.cp-hn h1{line-height:1.15}
.cp-acts{display:flex;gap:8px;margin-top:10px}
.cp-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
.cp-card{padding:0;overflow:hidden}
.cp-ch,.cp-sh h2{font-size:15px;font-weight:600}
.cp-ch{padding:16px 20px;border-bottom:1px solid var(--border)}

/* Plan generator view */
.gx-tot{padding:20px 24px 24px;margin:20px 0}
.gx-ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.gx-ch h2{font-size:15px;font-weight:600}
.gx-ctrls{display:flex;align-items:center;gap:14px}
.gx-check{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;white-space:nowrap}
.gx-check input{width:16px;height:16px;accent-color:#86BF1F;margin:0}
.gx-tog{position:relative;display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 12px 0 6px;border-radius:999px;background:var(--subtle);border:1px solid var(--border);font-size:13px;font-weight:500;color:var(--text-2);user-select:none;cursor:pointer;white-space:nowrap}
.gx-tog input{position:absolute;opacity:0;pointer-events:none}
.gx-sw{position:relative;width:34px;height:20px;border-radius:999px;background:var(--border-strong);transition:background .2s}
.gx-sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.gx-tog input:checked+.gx-sw{background:var(--lime)}
.gx-tog input:checked+.gx-sw::after{transform:translateX(14px)}
.gx-tog:has(input:checked){color:var(--text)}
.gx-tog:has(input:focus-visible){outline:2px solid var(--lime);outline-offset:2px}
.gx-allowed{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 20px;background:var(--subtle);border-bottom:1px solid var(--border)}
.gx-tot .gx-allowed{padding:0;background:none;border:0;margin:-4px 0 18px}
.gx-al-l{font-size:12px;font-weight:600;color:var(--text-3);margin-right:2px}
.gx-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-size:12px;white-space:nowrap}
.gx-chip b{font-weight:600}.gx-chip span{font-weight:500}
.gx-chip.off{border-color:#F2B33D;background:color-mix(in srgb,#F2B33D 10%,var(--surface))}
.gx-tk{color:var(--text)}.gx-tp,.gx-tp.num{color:var(--gx-p)}.gx-tc{color:var(--text-2)}.gx-tf{color:var(--gx-f)}
:root{--gx-p:#3F7A00;--gx-f:#B76E00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gx-p:#86C52A;--gx-f:#F5B83D}}
:root[data-theme="dark"]{--gx-p:#86C52A;--gx-f:#F5B83D}
.gx-bp{background:var(--mx-p,#3F7A00)}.gx-bc{background:var(--lime)}.gx-bf{background:#F2B33D}
.gx-tbody{display:grid;grid-template-columns:168px minmax(0,1fr);gap:28px;align-items:center}
.gx-ring{position:relative;width:148px;height:148px;margin:0 auto}
.gx-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.gx-ring circle{fill:none;stroke-width:12}
.gx-ring .trk{stroke:var(--sunken)}.gx-ring .val{stroke:#86BF1F}
.gx-rin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.gx-rin b{font-size:32px;font-weight:700;letter-spacing:-.03em}
.gx-rin span{font-size:12px;color:var(--text-3);margin-top:4px}
.gx-rcap{text-align:center;margin-top:10px;font-size:13px;line-height:1.35}
.gx-rcap b{display:block;font-weight:600}.gx-rcap span{color:var(--text-3);font-size:12px}
.gx-macros{display:flex;flex-direction:column;gap:10px}
.gx-mrow{padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:var(--subtle)}
.gx-mrow-t{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin-bottom:9px}
.gx-mrow-t span{display:inline-flex;align-items:center;gap:8px;color:var(--text-2);font-weight:500}
.gx-mrow-t i{width:9px;height:9px;border-radius:3px}

.gx-mbar{height:8px;border-radius:4px;overflow:hidden}
.gx-mbar i{display:block;height:100%;border-radius:4px}
.gx-meals{display:flex;flex-direction:column;gap:16px}
.gx-meal{overflow:hidden;padding:0}
.gx-meal.flash{animation:gxflash 1.4s ease-out}
@keyframes gxflash{0%{box-shadow:0 0 0 3px var(--lime)}100%{box-shadow:0 0 0 0 transparent}}
.gx-mh{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border)}
.gx-mic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--primary-soft);color:var(--accent);flex:none}

.gx-mt{flex:1;min-width:0}

.gx-ma{display:flex;align-items:center;gap:8px}
.gx-kpill{display:inline-flex;align-items:baseline;gap:3px;height:30px;padding:0 11px;border-radius:999px;background:var(--subtle);border:1px solid var(--border);line-height:28px;font-weight:600}
.gx-kpill span{font-size:12px;color:var(--text-3);font-weight:400}
.gx-ibtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text-2);cursor:pointer}
.gx-ibtn:hover:not(:disabled){background:var(--subtle);color:var(--text)}
.gx-ibtn:disabled{opacity:.4;cursor:default}
.gx-ftab{width:100%;border-collapse:collapse;table-layout:fixed}
.gx-ftab th{font-size:12px;font-weight:500;color:var(--text-3);text-align:left;padding:10px 20px;background:var(--subtle);border-bottom:1px solid var(--border)}

.gx-ftab tbody tr:not(.gx-addrow):hover td{background:var(--subtle)}
.gx-ftab tr.flash td{animation:gxrow 1.4s ease-out}
@keyframes gxrow{0%{background:var(--primary-soft)}100%{background:transparent}}
.gx-food{display:flex;align-items:center;gap:12px;min-width:0}
.gx-food>div{min-width:0}
.gx-food>div>b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-img{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 0 0 1px var(--border);overflow:hidden;display:grid;place-items:center;background:var(--subtle)}
.gx-img svg{display:block;width:100%;height:100%}
.gx-img i{width:10px;height:10px;border-radius:50%}
.gx-ghost{box-shadow:none;border:1.5px dashed var(--border-strong);background:none}
.gx-port{display:inline-flex;align-items:baseline;gap:3px;font-weight:600}
.gx-port span{font-size:12px;color:var(--text-3);font-weight:400}
.gx-uh{font-size:11px;color:var(--text-3)}
.gx-ract{display:flex;gap:6px;justify-content:flex-end}
.gx-rbtn{height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:12px;font-weight:500;cursor:pointer}
.gx-rbtn .ic{width:14px;height:14px}
.gx-rbtn:hover{background:var(--subtle);color:var(--text)}
.gx-rbtn.del:hover{color:#C2410C;border-color:#F3C9B6;background:#FFF4EE}
.gx-mobact,.gx-mob{display:none}
.gx-addrow td{height:auto;padding:12px 20px;background:var(--surface)}
.gx-addw{display:flex;align-items:flex-start;gap:12px}
.gx-search{position:relative;flex:1;max-width:560px}
.gx-search .input{width:100%;height:42px;border:1.5px solid #86BF1F;box-shadow:0 0 0 3px var(--primary-soft)}
.gx-results{position:static;margin-top:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px -16px rgba(10,15,36,.35);padding:6px;max-height:320px;overflow:auto}

.gx-rn{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.gx-noresult{padding:10px;font-size:13px;color:var(--text-3)}
.gx-addw .gx-rbtn{width:42px;height:42px;padding:0;justify-content:center}
.gx-mtot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;background:var(--subtle)}

.gx-addbar{display:flex;justify-content:center;padding:12px;border-top:1px solid var(--border)}

.gx-addbtn .ic{width:18px;height:18px}
.gx-actw{position:sticky;bottom:16px;display:flex;justify-content:center;margin-top:20px;z-index:20;pointer-events:none}

.gx-dark{background:var(--text);border-color:var(--text);color:var(--surface)}

@media (max-width:900px){.gx-tbody{grid-template-columns:1fr;gap:18px}}

  .gx-ftab td{height:auto;padding-top:11px;padding-bottom:11px}
  .gx-ftab .gx-cport{width:84px}
  .gx-mob{display:block;font-size:11px;color:var(--text-3);margin-top:2px}.gx-mob b{font-weight:600}
  .gx-mobact{display:flex;justify-content:flex-start;margin-top:8px}
  .gx-rbtn{height:28px}

  .gx-food{align-items:flex-start}
  .gx-mtot{flex-direction:column;align-items:flex-start;gap:4px;padding:12px 16px}.gx-mtot-v{gap:16px}
  .gx-addrow td{padding:12px 16px}.gx-addw .gx-img{display:none}

  .gx-actw{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .gx-acts{width:100%}.gx-acts .btn{flex:1;justify-content:center;padding:0 10px}
  .gx-l{display:none}
}

  .hm-of{display:none}
  .hm-wk{font-size:11px}.hm-segs{margin-top:0;gap:2px}.hm-segs i{height:5px}
  .hm-day{width:24px}.hm-day small{font-size:9px}.hm-day b{font-size:14px}
  .hm-renew{display:none}
  .hm-rn{display:inline-flex;align-items:center;height:17px;padding:0 6px;margin-left:5px;vertical-align:1px;border-radius:5px;border:0;background:var(--primary-soft);color:var(--accent);font:600 10px/1 var(--font,inherit);cursor:pointer}
  .hm-none{font-size:11px;text-align:center}
}


.who{display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--primary);background:var(--primary-soft);flex:none}
.tscroll{overflow-x:auto}

/* Dashboard */
.quick{display:flex;align-items:center;gap:12px;padding:18px 20px;flex-wrap:wrap}
.quick .lbl{font-size:15px;color:var(--text);font-weight:500}
.quick select{width:auto;min-width:220px;height:40px}
.todo{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border)}
.todo:last-child{border-bottom:0}
.todo .tx{flex:1;min-width:0}
.todo .tx b{font-weight:600}
.todo .tx div{font-size:13px;color:var(--text-3)}
.todo .kind{width:8px;height:8px;border-radius:2px;flex:none}
.stats{display:flex;gap:40px;flex-wrap:wrap;padding:4px 2px 0}
.stat .v{font-family:var(--display);font-size:28px;font-weight:650;letter-spacing:-.02em}
.stat .k{font-size:13px;color:var(--text-3)}
.dash{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;margin-top:28px}
.empty{padding:40px 24px;text-align:center;color:var(--text-2)}
.empty h3{font-size:16px;color:var(--text);margin-bottom:6px}
.empty .btn{margin-top:16px}

/* Builder */
.bhead{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
.bbar{max-width:1320px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:14px}
.bbar .pname{font-family:var(--display);font-weight:650;font-size:20px;letter-spacing:-.02em;border:1px solid transparent;background:none;color:var(--text);border-radius:6px;padding:2px 6px;margin-left:-6px;min-width:0;width:100%;max-width:420px}
.bbar .pname:hover{border-color:var(--border)} .bbar .pname:focus{outline:none;border-color:var(--primary);background:var(--surface)}
.bbar .sp{flex:1}
.totals{max-width:1320px;margin:0 auto;padding:4px 28px 14px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.tk{display:flex;align-items:baseline;gap:6px}
.tk .v{font-family:var(--display);font-weight:650;font-size:26px;letter-spacing:-.02em}
.tk .of{color:var(--text-3)}
.mt{min-width:130px;flex:1;max-width:200px}
.mt .row1{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:5px}
.mt .row1 b{color:var(--text);font-weight:600}
.meter{height:6px;background:var(--sunken);border-radius:3px;position:relative;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--c);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.meter::after{content:"";position:absolute;left:calc(100%/1.15);top:-3px;bottom:-3px;width:2px;background:var(--text-2);border-radius:1px}
.days{max-width:1320px;margin:0 auto;padding:0 28px;display:flex;gap:2px;align-items:center}
.days button.day{height:36px;padding:0 14px;border:0;background:none;cursor:pointer;color:var(--text-3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.days button.day.on{color:var(--text);border-bottom-color:var(--primary)}
.days button.day:hover{color:var(--text)}
.bwrap{max-width:1320px;margin:0 auto;padding:24px 28px 120px;display:grid;grid-template-columns:268px minmax(0,1fr);gap:28px;align-items:start}
.lcol{position:sticky;top:190px;display:flex;flex-direction:column;gap:22px}
.lcol h4{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:10px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgrid .input{height:34px}
.tin{position:relative}
.tin span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-3);pointer-events:none}
.tin .input{padding-right:34px}
.rules div+div{margin-top:10px}
.meals{display:flex;flex-direction:column;gap:14px}
.meal{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.meal:hover{border-color:var(--border-strong)}
.meal.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--hl-soft);border-color:var(--hl)}100%{background:var(--surface)}}
.meal-h{display:flex;align-items:center;gap:16px;padding:14px 16px 12px 18px}
.meal-t{flex:1;min-width:0}
.slot{font-size:12px;color:var(--text-3);font-weight:500}
.meal-t h3{font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-m{display:flex;gap:14px;align-items:baseline;font-size:13px;color:var(--text-2)}
.meal-m b{color:var(--text);font-weight:600}
.meal-m .kc b{font-size:15px}
.meal-a{display:flex;align-items:center;gap:2px}
.strip{display:flex;height:3px;margin:0 18px;gap:2px}
.strip i{display:block;height:100%;border-radius:2px}
.items{padding:6px 8px 4px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 92px 52px 40px 40px 40px 96px;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;min-height:40px}
.irow:hover{background:var(--subtle)}
.irow.flash{animation:flashrow 1.6s ease-out}
@keyframes flashrow{0%{background:var(--hl-soft)}100%{background:transparent}}
.irow.head{min-height:24px;font-size:11px;color:var(--text-3);font-weight:500}
.irow.head:hover{background:none}
.irow .c{text-align:right;font-size:13px;color:var(--text-2)}
.irow .c.k{color:var(--text)}
.food{display:flex;align-items:center;gap:9px;min-width:0}
.food .fname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food .uh{font-size:12px;color:var(--text-3);white-space:nowrap}
.rdot{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.gin-w{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.gin{width:60px;height:30px;text-align:right;border:1px solid transparent;border-radius:6px;background:none;color:var(--text);font:inherit;font-weight:500;padding:0 6px}
.irow:hover .gin{border-color:var(--border-strong);background:var(--surface)}
.gin:focus{outline:none;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-soft)}
.gin-w span{font-size:12px;color:var(--text-3)}
.ra{display:flex;justify-content:flex-end;gap:0}
.ra .iconbtn{width:28px;height:28px}
.ra .iconbtn:not(.on):not(.swapi){opacity:0}
.irow:hover .ra .iconbtn,.ra .iconbtn:focus-visible{opacity:1}
.ra .swapi{color:var(--primary)}
.meal-f{display:flex;align-items:center;gap:10px;padding:4px 12px 12px 12px;flex-wrap:wrap}
.offnote{font-size:13px;color:var(--warning);display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.offnote.off{color:var(--error)}
.adapted{font-size:12px;color:var(--text-3);padding:0 18px 4px}
.addmeal{border:1px dashed var(--border-strong);border-radius:10px;height:52px;background:none;cursor:pointer;color:var(--text-2);font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.addmeal:hover{background:var(--surface);color:var(--text)}

/* Side panel */
.scrim{position:fixed;inset:0;background:rgba(15,20,27,.18);z-index:39}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-3);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel.anim{animation:slidein .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.panel-h{padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.panel-h .top{display:flex;align-items:flex-start;gap:10px}
.panel-h h2{font-size:17px;font-weight:600;flex:1}
.panel-h .sub{font-size:13px;color:var(--text-3);margin-top:2px}
.panel-h .chips{margin-top:14px}
.panel-b{flex:1;overflow-y:auto;padding:10px}
.alt{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:12px;cursor:pointer;transition:background .1s,border-color .1s}
.alt:hover,.alt:focus-visible{background:var(--subtle);border-color:var(--border)}
.alt .l1{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.alt .nm{font-weight:600}
.alt .ingr{font-size:13px;color:var(--text-2);margin-top:3px;line-height:1.45}
.alt .mac{display:flex;gap:12px;font-size:12px;color:var(--text-3);margin-top:6px;align-items:center}
.alt .mac b{color:var(--text-2);font-weight:600}
.alt .fit{margin-left:auto;display:inline-flex;align-items:center;gap:5px}
.alt .dl{font-size:13px;font-weight:600;white-space:nowrap}
.panel-f{padding:12px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);display:flex;gap:14px;flex-wrap:wrap}
.grp{font-size:12px;color:var(--text-3);font-weight:500;padding:12px 12px 4px}

/* Modal */
.modal-w{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(15,20,27,.35)}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-3);width:min(820px,100%);max-height:88vh;display:flex;flex-direction:column;animation:pop .18s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.modal-h h2{flex:1;font-size:17px}
.modal-b{overflow-y:auto;padding:22px}
.modal-f{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* Generation */
.gen{width:min(420px,100%);padding:26px}
.gen h2{font-family:var(--display);font-size:22px;letter-spacing:-.02em;margin-bottom:16px}
.gstep{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--text-3);transition:color .2s}
.gstep.done{color:var(--text)}
.gstep .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;transition:all .2s}
.gstep.done .ck{background:var(--success);border-color:var(--success);color:#fff}
.gstep .ck .ic{width:11px;height:11px}
.skel{border-radius:6px;background:linear-gradient(90deg,var(--subtle) 20%,var(--sunken) 50%,var(--subtle) 80%);background-size:200% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);border-radius:10px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-3);font-size:14px;animation:tin .2s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:var(--bg);font-weight:600;cursor:pointer;padding:5px 9px;border-radius:6px;opacity:.9}
.toast button:hover{background:rgba(127,127,127,.25)}
@keyframes tin{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* Setup / form */
.form{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.fsec{padding:22px 24px;border-bottom:1px solid var(--border)}
.fsec:last-child{border-bottom:0}
.fsec h3{font-size:15px;margin-bottom:4px}
.fsec>p{font-size:13px;color:var(--text-3);margin-bottom:16px}
.picker{max-height:420px;overflow-y:auto;padding:6px}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:9px 10px;cursor:pointer}
.pick:hover{background:var(--subtle)}
.pick.on{background:var(--primary-soft);border-color:var(--primary)}
.pick .sm{font-size:12px;color:var(--text-3)}
.sticky-card{position:sticky;top:24px}
.tsum{padding:20px}
.tsum .big{font-family:var(--display);font-size:40px;font-weight:650;letter-spacing:-.03em;line-height:1}
.tsum .mx{display:flex;gap:18px;margin-top:14px}
.tsum .mx div{font-size:13px;color:var(--text-3)}
.tsum .mx b{display:block;font-size:17px;color:var(--text);font-weight:600}

/* Landing */
.lp{background:var(--bg)}
.lp-nav{max-width:1180px;margin:0 auto;padding:18px 28px;display:flex;align-items:center;gap:28px}
.lp-nav .links{display:flex;gap:22px;flex:1}
.lp-nav .links a{color:var(--text-2);font-weight:500}
.lp-nav .links a:hover{color:var(--text);text-decoration:none}
.lp-foot{max-width:1180px;margin:0 auto;padding:28px;display:flex;gap:20px;color:var(--text-3);font-size:13px;flex-wrap:wrap}

/* Brand page */
.bsec{padding:40px 0;border-top:1px solid var(--border)}
.bsec h2{font-family:var(--display);font-size:26px;letter-spacing:-.02em;margin-bottom:6px}
.bsec>p{color:var(--text-2);max-width:44em;margin-bottom:22px;line-height:1.6}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.swc .chipc{height:64px;border-radius:10px;border:1px solid var(--border)}
.swc b{display:block;font-size:13px;margin-top:8px}
.swc span{font-size:12px;color:var(--text-3)}
.msg dt{font-size:12px;color:var(--text-3);font-weight:500;margin-top:18px}
.msg dd{margin:4px 0 0;font-size:16px;line-height:1.5;max-width:44em}
.names td,.names th{padding:11px 14px;vertical-align:top}
.names tbody tr{cursor:default}
.names tbody tr:hover{background:none}
.pick-row td{background:var(--hl-soft)}

/* Variant map */
.vmap{width:100%;height:auto;display:block;background:var(--sunken);border:1px solid var(--border);border-radius:8px}
.vmap .gl{stroke:var(--grid)}
.vmap text{fill:var(--text-3);font:10px var(--mono)}
.vmap .d{fill:var(--text-3);cursor:pointer;transition:fill .12s}
.vmap .d:hover,.vmap .d.hot{fill:var(--primary)}
.vmap .halo{fill:none;stroke:var(--primary);stroke-width:1;opacity:0}
.vmap g.hot .halo,.vmap g:hover .halo{opacity:.5}
.vmap .cur{fill:var(--hl)} .vmap .curr{fill:none;stroke:var(--hl);stroke-width:1;opacity:.5}
.vmap .tgt{stroke:var(--text-3);stroke-dasharray:2 3}
.alt.hot{background:var(--subtle);border-color:var(--border-strong)}
.cntp{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--primary-soft);color:var(--accent);margin-left:2px}
.log{font-family:var(--mono);font-size:12.5px;line-height:1.9;color:var(--text-3)}
.log div{opacity:0;transition:opacity .15s}.log div.done{opacity:1}
.log b{color:var(--accent);font-weight:500}.log .v{color:var(--text)}
.gridbg{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
.win{border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow-2);overflow:hidden}
.win-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);font:12px var(--mono);color:var(--text-3)}
.win-h i{width:9px;height:9px;border-radius:50%;background:var(--border-strong)}
.win-b{padding:14px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.metrics div{padding:22px 24px;border-right:1px solid var(--border)}
.metrics div:last-child{border-right:0}
.metrics b{display:block;font:500 28px var(--mono);letter-spacing:-.03em;color:var(--text)}
.metrics span{font-size:13px;color:var(--text-3)}
.eyeb{font:12px var(--mono);color:var(--accent)}
@media (max-width:760px){.metrics{grid-template-columns:1fr 1fr}.metrics div:nth-child(2){border-right:0}}

/* ============ Marketing site (design system: 12-col / 1200px, spacing 8-12-16-24-32-48-64-96-128, radius 8 controls / 12 cards) ============ */
body.on-site{
  --m-bg:#FFFFFF; --m-bg-2:#F7F8F9; --m-surface:#FFFFFF; --m-border:#E6E8EC; --m-border-2:#D5D9DF;
  --m-text:#0B0E14; --m-text-2:#4A5260; --m-text-3:#5F6977;
  --m-lime:#B6F23A; --m-lime-2:#A7E329; --m-lime-soft:#EFF8DD; --m-lime-ink:#3F6B00; --m-on-lime:#0B0E14;
  --m-shadow:0 1px 2px rgba(11,14,20,.04),0 24px 48px -24px rgba(11,14,20,.16);
  --logo-tile:#0B0E14; --logo-ink:#FFFFFF;
  background:var(--m-bg);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.on-site{
  --m-bg:#07090D; --m-bg-2:#0B0F14; --m-surface:#0D1117; --m-border:#1C232D; --m-border-2:#2A3340;
  --m-text:#E8ECF2; --m-text-2:#98A2B0; --m-text-3:#7A8596;
  --m-lime-soft:#18210C; --m-lime-ink:#B6F23A;
  --m-shadow:0 24px 48px -24px rgba(0,0,0,.8);
  --logo-tile:#1A212B; --logo-ink:#E8ECF2;
}}
:root[data-theme="dark"] body.on-site{
  --m-bg:#07090D; --m-bg-2:#0B0F14; --m-surface:#0D1117; --m-border:#1C232D; --m-border-2:#2A3340;
  --m-text:#E8ECF2; --m-text-2:#98A2B0; --m-text-3:#7A8596;
  --m-lime-soft:#18210C; --m-lime-ink:#B6F23A;
  --m-shadow:0 24px 48px -24px rgba(0,0,0,.8);
  --logo-tile:#1A212B; --logo-ink:#E8ECF2;
}
.s{color:var(--m-text);background:var(--m-bg);font-size:17px;line-height:1.6}
.s a{color:inherit}
.s :focus-visible{outline:2px solid var(--m-lime-ink);outline-offset:2px;border-radius:6px}
.s-wrap{max-width:1264px;margin:0 auto;padding:0 32px}
.s-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:24px}
.s-c4{grid-column:span 4}.s-c8{grid-column:span 8}.s-c6{grid-column:span 6}.s-c7{grid-column:span 7}.s-c12{grid-column:1/-1}
/* type: H1 64 / H2 40 / H3 18 / body 17 / caption 13 */
.s-h1{font:600 64px/1.02 var(--ui);letter-spacing:-.04em;margin:0}
.s-h2{font:600 40px/1.1 var(--ui);letter-spacing:-.035em;margin:0}
.s-h3{font:600 18px/1.35 var(--ui);letter-spacing:-.01em;margin:0}
.s-body{font-size:17px;line-height:1.6;color:var(--m-text-2);margin:0;max-width:36em}
.s-cap{font-size:13px;line-height:1.5;color:var(--m-text-3);margin:0}
.s-eyebrow{font:500 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--m-text-3)}
/* buttons: one height, one radius */
.s-btn{height:44px;padding:0 20px;border-radius:8px;font:500 15px/1 var(--ui);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;cursor:pointer;text-decoration:none!important;white-space:nowrap;transition:background .12s,border-color .12s,transform .08s}
.s-btn:active{transform:translateY(1px)}
.s .s-btn-primary{background:var(--m-lime);color:var(--m-on-lime)}
.s .s-btn-primary:hover{background:var(--m-lime-2)}
.s .s-btn-secondary{background:var(--m-surface);color:var(--m-text);border-color:var(--m-border-2)}
.s .s-btn-secondary:hover{background:var(--m-bg-2)}
.s-link{font:500 15px/1 var(--ui);color:var(--m-text-2)!important;text-decoration:none!important;padding:14px 4px}
.s-link:hover{color:var(--m-text)!important}
/* nav */
.s-nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--m-bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--m-border);padding-top:env(safe-area-inset-top,0px)}
.s-nav .s-wrap{height:72px;display:flex;align-items:center;gap:32px}

.s-navlinks{display:flex;gap:24px;flex:1}
.s-navend{display:flex;align-items:center;gap:16px}
/* sections: one rhythm */
.s-sec{padding:128px 0;border-top:1px solid var(--m-border);scroll-margin-top:72px}
.s-hero{padding:96px 0 64px}
.s-hl{box-shadow:inset 0 -.14em 0 var(--m-lime)}

.s-head{margin-bottom:64px}

/* cards: one language */
.s-card{background:var(--m-surface);border:1px solid var(--m-border);border-radius:12px;padding:32px;height:100%}
.s-card .s-h3{margin-top:24px}
.s-card .s-body{margin-top:8px}
.s-ic{width:40px;height:40px;border-radius:8px;background:var(--m-bg-2);border:1px solid var(--m-border);display:grid;place-items:center;color:var(--m-text);font:500 13px/1 var(--mono)}
.s-ic .ic{width:20px;height:20px}
/* product window (hero + demo share it) */
.s-win{background:var(--m-surface);border:1px solid var(--m-border);border-radius:12px;box-shadow:var(--m-shadow);overflow:hidden;font-size:14px;line-height:1.45}
.s-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid var(--m-border)}

.s-chip{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 10px;border-radius:999px;background:var(--m-lime-soft);color:var(--m-lime-ink);font:500 13px/1 var(--ui)}
.s-chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.s-hrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;border-top:1px solid var(--m-border)}
.s-bar+.s-hrow{border-top:0}
.s-hrow .s-slot{font-size:13px;color:var(--m-text-3)}
.s-hrow .s-name{font-weight:600}
.s-hrow .num{color:var(--m-text)}
.s-htot{background:var(--m-bg-2)}
.s-reveal{animation:s-in .36s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
@keyframes s-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.s-ui-btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--m-border-2);background:var(--m-surface);color:var(--m-text);font:500 13px/1 var(--ui);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.s-ui-btn:hover{background:var(--m-bg-2)}
.s-ui-btn.on{background:var(--m-lime-soft);border-color:var(--m-lime-ink);color:var(--m-lime-ink)}
.s-tot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--m-border)}
.s-tot>div{padding:20px 24px;border-left:1px solid var(--m-border)}
.s-tot>div:first-child{border-left:0}

.s-track{height:4px;border-radius:2px;background:var(--m-border);margin-top:12px;overflow:hidden}

.s-track i.ok{background:var(--m-lime)}
.s-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;column-gap:24px;row-gap:8px;padding:16px 24px;border-top:1px solid var(--m-border);position:relative}
.s-rows>.s-row:first-child{border-top:0}
.s-row .s-slot{font-size:13px;color:var(--m-text-3)}
.s-row .s-name{font-weight:600;margin-top:2px}
.s-row .s-ingr{font-size:13px;color:var(--m-text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.s-nums{display:grid;grid-template-columns:84px 52px 52px 52px;text-align:right;font:13px/1.4 var(--mono);color:var(--m-text-2)}
.s-nums b{color:var(--m-text);font-weight:500;font-size:14px}
.s-row.flash{animation:s-flash 1.1s ease-out}
.s-row.flash::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--m-lime);animation:s-fade 1.1s ease-out forwards}
@keyframes s-flash{from{background:var(--m-lime-soft)}to{background:transparent}}
@keyframes s-fade{0%,60%{opacity:1}100%{opacity:0}}
.s-alts{padding:16px 24px 24px;background:var(--m-bg-2);border-top:1px solid var(--m-border)}
.s-alts-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.s-alt{text-align:left;background:var(--m-surface);border:1px solid var(--m-border);border-radius:8px;padding:12px 16px;cursor:pointer;color:var(--m-text);font:inherit;transition:border-color .12s,transform .08s}
.s-alt:hover{border-color:var(--m-border-2)}

.s-alt span{display:block;font:13px/1.4 var(--mono);color:var(--m-text-2);margin-top:4px}
/* footer */
.s-foot{border-top:1px solid var(--m-border);padding:48px 0}

/* ===== Apple design layer: system type, instant response, materials, fluid motion ===== */
:root{
  /* System font first: it ships optical sizing and tracking tables. Numerals use tabular figures, not a mono face. */
  --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable Text','Segoe UI',system-ui,Roboto,'Helvetica Neue',sans-serif;
  --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI Variable Display','Segoe UI',system-ui,Roboto,sans-serif;
  --mono:var(--ui);
  --code:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --hair:color-mix(in srgb,var(--text) 10%,transparent);
  --edge:rgba(255,255,255,.55);
  --mat-thin:blur(20px) saturate(180%);
  --mat-thick:blur(40px) saturate(180%);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--edge:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--edge:rgba(255,255,255,.07)}

/* Type: tracking is size-specific. Tight on large text, near zero on body, slightly open on small labels */
body{font-family:var(--ui);letter-spacing:-.01em;font-optical-sizing:auto;font-variant-numeric:tabular-nums;text-rendering:optimizeLegibility}
.num{letter-spacing:0}
.hint,.badge,.slot,.grp,.panel-f,.pm-slot,.pv-hd,.irow.head,.pb-tg span,.pv-chip small,.pv-rng>span,.food .uh,.pm-ingr,.s-cap,.mm-ft span,.kpi .s{letter-spacing:.005em}
.pb-tag,.lcol h4,.s-eyebrow,.pb-live{font-family:var(--ui);font-weight:600;letter-spacing:.06em}
.eyeb{font:600 11px/1.2 var(--ui);letter-spacing:.06em;text-transform:uppercase}
.page-h h1,.pb-hero h1,.display,.gen h2,.bsec h2,.pdoc h1{font-family:var(--display);font-weight:700;letter-spacing:-.022em;line-height:1.12}
.s-h1,.s-hero .s-h1{font-family:var(--display);font-weight:700;letter-spacing:-.03em;line-height:1.04}
.s-h2{font-family:var(--display);font-weight:700;letter-spacing:-.025em;line-height:1.1}
.s-h3,.section-t,.pv-sh h2,.panel-h h2,.modal-h h2,.meal-t h3,.pv-mtl h3,.pcard-t,.folder-t,.bbar .pname{letter-spacing:-.012em}
.brand,.s-logo{letter-spacing:-.02em}
.kpi .v,.pb-k b,.pv-rc b,.mms-k b,.logw .wf b,.metrics b,.s-tv,.folder-n,.tsum .big,.tk .v,.stat .v,.pv-mk b,.pb-mb-t b,.pb-tg b{font-weight:600;letter-spacing:-.022em}
.kpi .v,.pb-k b,.tsum .big{letter-spacing:-.03em}
.log,.logw .wb,.logw .wh,.win-h{font-family:var(--code);letter-spacing:0}

/* Response: feedback lands on press, not on release */
.btn,.s-btn,.s-ui-btn,.chip,.seg button,.iconbtn,.tt button,.pv-tog,.addmeal,.nav a,.mtab a,.side-foot a,.ptab,.days button.day,.pb-more-b{transition:transform .1s ease-out,background-color .12s,border-color .12s,color .12s,box-shadow .12s,opacity .12s}
.btn:active,.s-btn:active,.s-ui-btn:active,.chip:active,.seg button:active,.iconbtn:active,.tt button:active,.addmeal:active,.nav a:active,.mtab a:active,.side-foot a:active,.pv-tog:active{transform:scale(.97)}
.alt,.pick,.pitem,.pv-opt,.s-alt,.kpi,.folder,.mm-food{transition:transform .12s ease-out,background-color .12s,border-color .12s,box-shadow .12s}
.alt:active,.pick:active,.pitem:active,.pv-opt:active,.s-alt:active,.kpi:active,.folder:active{transform:scale(.985)}
.table tbody tr:active{background:var(--sunken)}
.box,.meal{border-radius:12px}

/* Materials: translucent chrome with content scrolling underneath. A hairline appears only once content is under it */
.bhead{background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:var(--mat-thin);backdrop-filter:var(--mat-thin);border-bottom-color:transparent;transition:box-shadow .2s}
.fx-scrolled .bhead{box-shadow:0 1px 0 var(--hair),0 10px 24px -18px rgba(10,15,36,.3)}
.s-nav{background:rgba(10,15,36,.7)!important;-webkit-backdrop-filter:var(--mat-thin)!important;backdrop-filter:var(--mat-thin)!important;border-bottom-color:transparent!important;transition:box-shadow .2s}

  .side{background:rgba(10,15,36,.78);-webkit-backdrop-filter:var(--mat-thin);backdrop-filter:var(--mat-thin)}
  .mtab{background:rgba(10,15,36,.78);-webkit-backdrop-filter:var(--mat-thin);backdrop-filter:var(--mat-thin);border-top:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .pb-mbar,.pv-act{background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:var(--mat-thin);backdrop-filter:var(--mat-thin);border-top-color:transparent;box-shadow:0 -1px 0 var(--hair)}
}
/* Side panel: a thick material (bigger surface = more blur, deeper shadow), a bright edge where light catches it. Swipe right to dismiss */
.scrim{background:rgba(10,15,36,.16);will-change:opacity}
.panel{background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:var(--mat-thick);backdrop-filter:var(--mat-thick);border-left:0;box-shadow:inset 1px 0 0 var(--edge),var(--shadow-3);touch-action:pan-y;will-change:translate}
.panel.anim{animation:none}
.panel-h{border-bottom-color:var(--hair)}.panel-f{border-top-color:var(--hair)}
.alt:hover,.alt:focus-visible,.alt.hot{background:color-mix(in srgb,var(--text) 5%,transparent);border-color:var(--hair)}
/* Modal: dims to focus; materializes from the control that opened it. On phones it is a sheet you can pull down */
.modal-w{background:rgba(10,15,36,calc(.32 * var(--fxp,1)))}
.modal{animation:none;box-shadow:inset 0 1px 0 var(--edge),var(--shadow-3);will-change:translate,scale,opacity}

const PCAT={chicken:'Poultry',turkey:'Poultry',beef:'Meat',tuna:'Seafood',tilapia:'Seafood',salmon:'Seafood',shrimp:'Seafood',egg:'Eggs',eggw:'Eggs',yogurt:'Dairy',cottage:'Dairy',whey:'Dairy',tofu:'Plant',ful:'Plant',lentils:'Plant',chickpeas:'Plant',hummus:'Plant'};
const CATS=['Poultry','Meat','Seafood','Eggs','Dairy','Plant'];
const PRIMARY={protein:'p',legume:'p',carb:'c',fruit:'c',fat:'f',veg:'k',milk:'k'};
const ROLE_COLOR={protein:'protein',legume:'protein',carb:'carbs',fruit:'carbs',fat:'fat',veg:'text-3',milk:'text-3'};
const ALLERGENS=[['gluten','Gluten'],['dairy','Dairy'],['egg','Egg'],['fish','Fish'],['shellfish','Shellfish'],['peanut','Peanut'],['treenut','Tree nuts'],['sesame','Sesame'],['soy','Soy']];

const r1=x=>Math.round(x);
function macros(items){const t={k:0,p:0,c:0,f:0};for(const it of items){const f=FOODS[it.fid];if(!f)continue;const q=it.g/100;t.k+=f.k*q;t.p+=f.p*q;t.c+=f.c*q;t.f+=f.f*q;}return t;}
function scaleT(T,s){return {k:T.k*s,p:T.p*s,c:T.c*s,f:T.f*s};}
const W={k:5,p:3,c:1,f:1.2}, FLOOR={k:100,p:8,c:10,f:5}, KEYS=['k','p','c','f'];
function fitErr(m,T){let s=0;for(const j of KEYS){const d=Math.max(T[j],FLOOR[j]);s+=W[j]*((m[j]-T[j])/d)**2;}return Math.sqrt(s/10.2);}
function status(m,T){const dk=Math.abs(m.k-T.k),dp=T.p-m.p;if(dk<=Math.max(T.k*.05,25)&&dp<=Math.max(T.p*.1,4))return 'ok';if(dk<=Math.max(T.k*.1,50)&&dp<=Math.max(T.p*.2,8))return 'near';return 'off';}

function allowed(f,r){
  if(!r)return true;const t=f.tags,d=r.diet||'none';
  if(d==='vegetarian'&&t.some(x=>['meat','fish','shellfish'].includes(x)))return false;
  if(d==='pescatarian'&&t.includes('meat'))return false;
  if(d==='vegan'&&t.some(x=>['meat','fish','shellfish','dairy','egg','honey'].includes(x)))return false;
  if((r.allergies||[]).some(a=>t.includes(a)))return false;
  if((r.dislikes||[]).includes(f.id))return false;
  return true;
}
const ctxOk=(a,o)=>o.ctx==='both'||a.ctx==='both'||a.ctx===o.ctx;
function roundG(fid,g){const f=FOODS[fid];const st=f.step;return Math.max(st,Math.round(g/st)*st);}
function clampG(fid,g){const f=FOODS[fid];return Math.min(f.max,Math.max(f.min,g));}
function matchGrams(from,g,to){
  const A=FOODS[from],B=FOODS[to];let key=PRIMARY[A.role]||'k';
  if(A[key]<0.5||B[key]<0.5)key='k';
  return roundG(to,clampG(to,g*A[key]/B[key]));
}
function profileDist(a,b){const n=x=>{const k=Math.max(x.k,1);return [x.p*4/k,x.c*4/k,x.f*9/k];};const A=n(a),B=n(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]);}
function altFoods(fid,rules,exclude=[]){
  const o=FOODS[fid];
  return Object.values(FOODS).filter(f=>f.id!==fid&&f.role===o.role&&ctxOk(f,o)&&allowed(f,rules)&&!exclude.includes(f.id))
    .sort((a,b)=>(profileDist(a,o)-(PCAT[a.id]&&PCAT[a.id]===PCAT[o.id]?.5:0))-(profileDist(b,o)-(PCAT[b.id]&&PCAT[b.id]===PCAT[o.id]?.5:0)));
}
// Replace anything the client can't eat with the closest allowed food.
function adapt(items,rules){
  const out=[],notes=[];
  for(const it of items){
    const f=FOODS[it.fid];
    if(allowed(f,rules)){out.push({fid:it.fid,g:it.g,locked:!!it.locked});continue;}
    const alts=altFoods(it.fid,rules,items.map(x=>x.fid).concat(out.map(x=>x.fid)));
    if(!alts.length){if(['fat','veg','fruit','milk'].includes(f.role))continue;return null;}
    out.push({fid:alts[0].id,g:matchGrams(it.fid,it.g,alts[0].id),locked:false});notes.push([f.id,alts[0].id]);
  }
  return out.length?{items:out,notes}:null;
}
// Portion solver: scale unlocked items so the meal lands on its targets, keeping the meal's shape.
function solve(items,T,iters=260,_pass=0){
  const it=items.map(x=>({...x}));
  const free=[],lk={k:0,p:0,c:0,f:0};
  it.forEach((x,i)=>{const f=FOODS[x.fid];if(x.locked){for(const j of KEYS)lk[j]+=f[j]*x.g/100;}else free.push(i);});
  if(!free.length)return it;
  const b=free.map(i=>Math.max(it[i].g,1));
  const a=free.map((i,n)=>{const f=FOODS[it[i].fid];return {k:f.k*b[n]/100,p:f.p*b[n]/100,c:f.c*b[n]/100,f:f.f*b[n]/100};});
  const baseK=a.reduce((s,x)=>s+x.k,0)||1;
  const s=Math.min(5,Math.max(.3,(T.k-lk.k)/baseK));
  const cap=Math.max(1,Math.min(2.6,T.k/650)); // bigger meals may use bigger portions
  const lam=free.map(i=>FOODS[it[i].fid].role==='veg'?.6:.05);
  const lo=free.map((i,n)=>FOODS[it[i].fid].min/b[n]), hi=free.map((i,n)=>FOODS[it[i].fid].max*cap/b[n]);
  const D={};for(const j of KEYS)D[j]=Math.max(T[j],FLOOR[j]);
  let r=free.map((_,n)=>Math.min(hi[n],Math.max(lo[n],s)));
  const H=free.map((_,n)=>{let h=2*lam[n];for(const j of KEYS)h+=2*W[j]*(a[n][j]/D[j])**2;return h;});
  for(let t=0;t<iters;t++){
    const tot={...lk};for(let n=0;n<free.length;n++)for(const j of KEYS)tot[j]+=r[n]*a[n][j];
    const e={};for(const j of KEYS)e[j]=(tot[j]-T[j])/D[j];
    for(let n=0;n<free.length;n++){
      let g=2*lam[n]*(r[n]-s);for(const j of KEYS)g+=2*W[j]*e[j]*a[n][j]/D[j];
      r[n]=Math.min(hi[n],Math.max(lo[n],r[n]-.45*g/H[n]));
    }
  }
  free.forEach((i,n)=>{it[i].g=r[n]*b[n];});
  if(_pass===0){
    // coarse units (whole eggs) first, then re-fit everything else around them
    const coarse=free.filter(i=>FOODS[it[i].fid].step>=25);
    if(coarse.length){
      coarse.forEach(i=>{it[i].g=roundG(it[i].fid,it[i].g);it[i]._tmp=true;it[i].locked=true;});
      const res=solve(it,T,180,1);
      res.forEach(x=>{if(x._tmp){x.locked=false;delete x._tmp;}});
      return res.map(x=>({...x,g:roundG(x.fid,x.g)}));
    }
  }
  return it.map(x=>x.locked&&!x._tmp?x:{...x,g:roundG(x.fid,x.g)});
}
function mainProtein(items){const x=items.find(i=>['protein','legume'].includes(FOODS[i.fid].role))||items.find(i=>PCAT[i.fid]);return x?x.fid:null;}
const catOf=items=>{const p=mainProtein(items);return p?PCAT[p]:null;};

// Targets
const ACT_F={sedentary:1.2,light:1.375,moderate:1.55,athlete:1.725};
const ACT_L=[['sedentary','Sedentary'],['light','Light'],['moderate','Moderate'],['athlete','Athlete']];
const GOAL_L=[['lose','Fat loss'],['maintain','Maintenance'],['gain','Muscle gain']];
function computeTargets(p){
  const w=+p.weight||70,h=+p.height||170,age=+p.age||30;
  let bmr=p.bodyFat>3&&p.bodyFat<60?370+21.6*w*(1-p.bodyFat/100):10*w+6.25*h-5*age+(p.sex==='female'?-161:5);
  let tdee=bmr*(ACT_F[p.activity]||1.55);
  let k=p.goal==='lose'?Math.max(tdee*.8,bmr*1.05):p.goal==='gain'?tdee*1.12:tdee;
  k=Math.round(k/10)*10;
  const hm=h/100,bmi=w/(hm*hm);
  const ideal=22.5*hm*hm, pw=bmi>=30?ideal+.25*(w-ideal):w; // adjusted body weight above BMI 30
  let prot=pw*(p.goal==='lose'?2.0:p.goal==='gain'?1.8:1.6);
  prot=Math.min(prot,k*.4/4);
  const fat=k*.27/9, carb=Math.max(0,(k-prot*4-fat*9)/4);
  return {k,p:Math.round(prot),c:Math.round(carb),f:Math.round(fat)};
}
const DIST={balanced:{breakfast:25,lunch:35,dinner:30,snack:10},breakfast:{breakfast:35,lunch:30,dinner:25,snack:10},lunch:{breakfast:22,lunch:43,dinner:25,snack:10},dinner:{breakfast:22,lunch:28,dinner:40,snack:10}};
const DIST_L=[['balanced','Balanced'],['breakfast','Breakfast-heavy'],['lunch','Lunch-heavy'],['dinner','Dinner-heavy']];
const LAYOUT={2:['breakfast','dinner'],3:['breakfast','lunch','dinner'],4:['breakfast','lunch','snack','dinner'],5:['breakfast','snack','lunch','snack','dinner']};
function buildSlots(n,dist){const L=LAYOUT[n]||LAYOUT[4],d=DIST[dist]||DIST.balanced;const w=L.map(s=>d[s]),sum=w.reduce((a,b)=>a+b,0);return L.map((s,i)=>({slot:s,type:s==='lunch'||s==='dinner'?'main':s,share:w[i]/sum}));}

function fitCandidate(c,T,rules){
  const ad=adapt(c.items,rules);if(!ad)return null;
  const items=solve(ad.items.map(x=>({...x,locked:false})),T);
  const m=macros(items);
  let name=c.name;
  for(const [a,b] of ad.notes){const oa=FOODS[a].name.split(/[ ,]/)[0],nb=FOODS[b].name.split(',')[0];const re=new RegExp('\\b'+oa+'\\b','i');if(re.test(name))name=name.replace(re,m=>m[0]===m[0].toUpperCase()?nb:nb.toLowerCase());}

function likeBonus(items,r){return items.filter(i=>(r.likes||[]).includes(i.fid)).length;}
function generateDay(plan,avoid=new Set(),favs=[]){
  const used=new Set(),usedCat=new Set(),meals=[];
  for(const s of buildSlots(plan.mealCount,plan.distribution)){
    const T=scaleT(plan.targets,s.share);
    const cs=candidates(s.type,favs).filter(c=>!used.has(c.id)).map(c=>fitCandidate(c,T,plan.rules)).filter(Boolean);
    cs.forEach(c=>{const cat=catOf(c.items);c.score=c.err+(avoid.has(c.id)?.2:0)+(cat&&usedCat.has(cat)?.12:0)-likeBonus(c.items,plan.rules)*.05+c.notes.length*.06+Math.random()*.05;});
    cs.sort((a,b)=>a.score-b.score);
    const pick=cs[1]&&cs[1].err<cs[0].err+.04&&Math.random()<.4?cs[1]:cs[0];
    if(!pick){meals.push({id:uid(),slot:s.slot,type:s.type,share:s.share,src:null,name:'No meal fits these rules',items:[]});continue;}
    used.add(pick.id);const cat=catOf(pick.items);if(cat)usedCat.add(cat);
    meals.push({id:uid(),slot:s.slot,type:s.type,share:s.share,src:pick.id,name:pick.name,items:pick.items.map(x=>({fid:x.fid,g:x.g,locked:false})),notes:pick.notes});

// Re-fit a whole day. If a meal hits its portion caps, its unmet calories move to meals that have room.
function fitDay(plan,day){
  const ms=day.meals.filter(m=>m.items.length);
  const lost=day.meals.filter(m=>!m.items.length).reduce((a,m)=>a+m.share,0);
  if(lost&&ms.length){const tot=ms.reduce((a,m)=>a+m.share,0);ms.forEach(m=>{m.share+=lost*m.share/tot;});day.meals.filter(m=>!m.items.length).forEach(m=>{m.share=0;});}
  for(let pass=0;pass<3;pass++){
    ms.forEach(m=>{m.items=solve(m.items,scaleT(plan.targets,m.share));});
    const got=ms.map(m=>macros(m.items).k),tg=ms.map(m=>plan.targets.k*m.share);
    let deficit=0;const short=new Set();
    ms.forEach((m,i)=>{if(got[i]<tg[i]*.96){deficit+=tg[i]-got[i];short.add(i);}});
    if(deficit<plan.targets.k*.01||short.size===ms.length)break;
    const room=ms.map((m,i)=>short.has(i)?0:m.share),rs=room.reduce((a,b)=>a+b,0);if(!rs)break;
    ms.forEach((m,i)=>{if(short.has(i))m.share=got[i]/plan.targets.k;else m.share+=deficit/plan.targets.k*room[i]/rs;});
  }
  return day;
}
function mealAlternatives(plan,day,meal,favs,filter){
  const T=scaleT(plan.targets,meal.share);
  const inDay=new Set(day.meals.map(m=>m.src));
  let cs=candidates(meal.type,favs).filter(c=>c.id!==meal.src).map(c=>fitCandidate(c,T,plan.rules)).filter(Boolean);
  if(filter==='saved')cs=cs.filter(c=>c.src==='fav');
  else if(filter&&filter!=='all')cs=cs.filter(c=>catOf(c.items)===filter);
  cs.forEach(c=>{c.score=c.err+(inDay.has(c.id)?.25:0)-likeBonus(c.items,plan.rules)*.03;});
  return cs.sort((a,b)=>a.score-b.score).slice(0,14);
}
function itemAlternatives(plan,meal,idx,mode,q){
  const T=scaleT(plan.targets,meal.share),cur=meal.items[idx],o=FOODS[cur.fid];
  const inMeal=meal.items.map(x=>x.fid);
  let pool;
  if(q){const s=q.toLowerCase();pool=Object.values(FOODS).filter(f=>f.id!==cur.fid&&f.name.toLowerCase().includes(s)&&allowed(f,plan.rules)&&!inMeal.includes(f.id));}

  return pool.map(f=>{
    const g=f.role===o.role?matchGrams(cur.fid,cur.g,f.id):roundG(f.id,clampG(f.id,cur.g*o.k/Math.max(f.k,1)));

    const m=macros(items),ng=items[idx].g;

  </tbody></table>`;

function spark(a){if(!a.length)return '';return `<div class="spark" aria-hidden="true">${a.slice(0,24).map(x=>`<i class="${x}"></i>`).join('')}</div>`;}
function sortPlans(list){return [...list].sort((a,b)=>{const sa=planState(a),sb=planState(b);if(sa!==sb)return sa==='ongoing'?-1:1;return sa==='ongoing'?planEnds(a)-planEnds(b):planEnds(b)-planEnds(a);});}
function pageHome(){
  const {clients,plans}=S.data,now=Date.now(),SOON=14*DAY_MS;
  const hr=new Date().getHours(),who=session()?.name?.split(' ')[0],greet=(hr<5?'Welcome back':hr<12?'Good morning':hr<17?'Good afternoon':'Good evening')+(who?`, ${esc(who)}`:'');
  const today=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  const md=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const nf=clients.filter(c=>c.sex==='female').length,nm=clients.filter(c=>c.sex==='male').length;
  const active=plans.filter(p=>planState(p)==='ongoing'),expired=plans.filter(p=>planState(p)==='expired');
  const soon=active.filter(p=>planEnds(p)-now<=SOON),onTrack=active.length-soon.length,tot=plans.length;

  // Plan status ring
  const R=30,C=2*Math.PI*R;let off=0;
  const seg=(n,cls)=>{if(!n||!tot)return '';const L=C*n/tot,g=tot>1&&n<tot?2:0,o=`<circle r="${R}" cx="38" cy="38" class="${cls}" stroke-dasharray="${(L-g).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/>`;off+=L;return o;};
  const ring=`<circle r="${R}" cx="38" cy="38" class="hm-trk"/>`+seg(onTrack,'hm-on')+seg(soon.length,'hm-soon')+seg(expired.length,'hm-ex');
  // Calorie range: top 3 bands among active plans
  const bands={};active.forEach(p=>{const lo=bandOf(p.targets.k);bands[lo]=(bands[lo]||0)+1;});
  const top=Object.entries(bands).sort((x,y)=>y[1]-x[1]||x[0]-y[0]).slice(0,3),mx=top.length?top[0][1]:1;
  const kk=v=>(v/1000).toFixed(1).replace(/\.0$/,'');
  const calRows=top.length?top.map(([lo,n])=>`<div class="hm-hr"><span>${kk(+lo)}–${kk(+lo+BAND)}k</span><div class="hm-tr"><i style="width:${n/mx*100}%"></i></div><b>${n}</b></div>`).join(''):`<p class="hm-empty">No active plans yet.</p>`;

  // Recent plans: 5 fixed rows
  const recent=[...plans].sort((x,y)=>y.updatedAt-x.updatedAt).slice(0,4);
  const prow=p=>{const c=clientById(p.clientId),ex=planState(p)==='expired',w=planWeeks(p),el=Math.max(0,now-planStart(p)),wk=Math.min(w,Math.floor(el/(7*DAY_MS))+1),pct=Math.min(100,el/(planEnds(p)-planStart(p))*100);
    return `<a class="hm-row" href="#/app/plan/${p.id}"><div class="hm-main"><div class="hm-pn">${esc(p.name)}</div><div class="hm-sub">${c?esc(c.name):'General'}${ex?'':`<span class="hm-wkm"> · Wk ${wk}/${w}</span>`}</div></div>
      <div class="hm-prog">${ex?`<span class="hm-exp">Expired</span>`:`<div class="hm-wk"><span>Week ${wk}<span class="hm-of"> of ${w}</span></span><em>ends ${md(planEnds(p))}</em></div><div class="hm-segs" style="--n:${w}">${Array.from({length:w},(_,i)=>`<i class="${i<wk-1?'done':i===wk-1?'now':''}"></i>`).join('')}</div>`}</div></a>`;};
  const blank='<div class="hm-row hm-blank"><i></i></div>';
  const recentRows=recent.map(prow).join('')+blank.repeat(4-recent.length);

  // Expiring soon: 5 fixed rows
  const due=[...expired.sort((x,y)=>planEnds(y)-planEnds(x)),...soon.sort((x,y)=>planEnds(x)-planEnds(y))].slice(0,4);
  const drow=p=>{const ex=planState(p)==='expired',d=Math.round((planEnds(p)-now)/DAY_MS),dt=new Date(planEnds(p)),warn=ex||d<=7;
    const when=ex?'Expired':d<=0?'Ends today':d===1?'Ends tomorrow':`Ends in ${d} days`;
    return `<a class="hm-row" href="#/app/plan/${p.id}"><div class="hm-day"><small>${dt.toLocaleDateString('en-GB',{month:'short'})}</small><b>${dt.getDate()}</b></div><div class="hm-main"><div class="hm-pn">${esc(p.name)}</div><div class="hm-sub ${warn?'warn':''}">${when}${ex?`<button class="hm-rn" data-act="renewPlan" data-id="${p.id}" aria-label="Renew ${esc(p.name)}">Renew</button>`:''}</div></div>${warn?`<button class="btn btn-secondary btn-sm hm-renew" data-act="renewPlan" data-id="${p.id}">Renew</button>`:''}</a>`;};
  const dueRows=due.map(drow).join('')+(due.length<4?`<div class="hm-row hm-none">${due.length?'Nothing else ending':'Nothing ending soon'}</div>`:'')+'<div class="hm-row hm-blank"></div>'.repeat(Math.max(0,3-due.length));

  return `<div class="page hm">
    <div class="page-h"><div><div class="hm-date">${today}</div><h1>${greet}</h1><p><b class="hm-b">${clients.length}</b> client${clients.length===1?'':'s'}${clients.length?` (${nf} F · ${nm} M)`:''}<span class="hm-dot"></span><b class="hm-b">${active.length}</b> plan${active.length===1?'':'s'} running</p></div><a class="btn btn-primary" href="#/app/new">${icon('plus')}New plan</a></div>
    <section class="box hm-strip" aria-label="Overview">
      <div class="hm-sp">
        <div class="hm-ch"><span class="hm-ct">Plan status</span><span class="hm-cv">${tot} plan${tot===1?'':'s'}</span></div>
        <div class="hm-st"><div class="hm-ring" role="img" aria-label="${onTrack} on track, ${soon.length} ending soon, ${expired.length} expired"><svg viewBox="0 0 76 76">${ring}</svg><div class="hm-rc"><b>${active.length}</b><span>active</span></div></div>
          <div class="hm-lg"><div><i class="hm-on"></i>On track<b>${onTrack}</b></div><div><i class="hm-soon"></i>Ending soon<b>${soon.length}</b></div><div><i class="hm-ex"></i>Expired<b>${expired.length}</b></div></div></div>
      </div>
      <div class="hm-sc">
        <div class="hm-ch"><span class="hm-ct">Calorie range</span><span class="hm-cv">Top 3 · kcal</span></div>
        <div class="hm-rows">${calRows}</div>
      </div>
    </section>
    <div class="hm-lower">
      <section class="box hm-card"><div class="hm-th"><h2>Recent plans</h2><a href="#/app/plans"><span class="hm-va">View all</span>${icon('arrow')}</a></div>${recentRows}</section>
      <section class="box hm-card"><div class="hm-th"><h2>Expiring soon</h2><span class="hint hm-va">Next 14 days</span></div>${dueRows}</section>
    </div>
  </div>`;
}

const isoToMs=v=>{const [y,m,d]=String(v).split('-').map(Number);return y?new Date(y,m-1,d,new Date().getHours(),new Date().getMinutes()).getTime():Date.now();};

/* ---------------- Builder ---------------- */
function mealT(p,m){return scaleT(p.targets,m.share);}
function slotLabel(p,day,i){
  const m=day.meals[i];
  if(m.slot!=='snack')return m.slot[0].toUpperCase()+m.slot.slice(1);
  const sn=day.meals.filter(x=>x.slot==='snack');if(sn.length===1)return 'Snack';
  const k=sn.indexOf(m);return k===0?'Morning snack':k===1?'Afternoon snack':'Evening snack';
}
function isFav(m){return S.data.favorites.some(f=>f.type===m.type&&f.name===m.name);}
function pageBuilder(id){
  const p=planById(id);
  if(!p)return shell('plans',notFound());
  if(S.ui.planId!==id){S.ui.planId=id;S.ui.day=0;S.ui.hist={past:[],future:[]};S.ui.panel=null;S.ui.cycle={};S.ui.tdraft=null;}
  if(S.ui.day>=p.days.length)S.ui.day=p.days.length-1;
  const day=p.days[S.ui.day],c=clientById(p.clientId);
  const tot=macros(day.meals.flatMap(m=>m.items)),st=status(tot,p.targets);

  const h=S.ui.hist;
  return `<div class="bhead">
    <div class="bbar">
      <a class="iconbtn" href="${c?'#/app/clients/'+c.id:'#/app/plans'}" title="Back">${icon('back')}</a>
      <div style="min-width:0;flex:1"><input class="pname" value="${esc(p.name)}" data-planname="1" aria-label="Plan name"><div class="hint" style="margin-top:1px">${c?`<a href="#/app/clients/${c.id}">${esc(c.name)}</a>`:'General plan'} &nbsp; ${stateBadge(p)} &nbsp; ${endsLabel(p)}</div></div>
      ${themeToggle()}
      <button class="iconbtn hide-s" data-act="undo" title="Undo (Ctrl+Z)" ${h.past.length?'':'disabled'}>${icon('undo')}</button>
      <button class="iconbtn hide-s" data-act="redo" title="Redo (Ctrl+Shift+Z)" ${h.future.length?'':'disabled'}>${icon('redo')}</button>
      <button class="iconbtn hide-s" data-act="shortcuts" title="Keyboard shortcuts (?)">${icon('key')}</button>
      <button class="btn btn-primary btn-sm" data-act="exportPlan" data-id="${p.id}" title="Export plan as PDF">${icon('print')}<span class="hide-s">Export plan</span></button>
      <button class="iconbtn" data-act="dupPlan" data-id="${p.id}" title="Duplicate plan">${icon('copy')}</button>
      <button class="iconbtn" data-act="delPlan" data-id="${p.id}" title="Delete plan">${icon('trash')}</button>
    </div>
    <div class="totals">
      <div class="tk"><span class="sdot ${st==='ok'?'':st}" title="${st==='ok'?'On target':st==='near'?'Close to target':'Off target'}"></span><span class="v num">${fmt(tot.k)}</span><span class="of num">/ ${fmt(p.targets.k)} kcal</span></div>
      ${meter('Protein',tot.p,p.targets.p,'protein')}${meter('Carbs',tot.c,p.targets.c,'carbs')}${meter('Fat',tot.f,p.targets.f,'fat')}
      ${st!=='ok'?`<button class="btn btn-secondary btn-sm" data-act="rebalanceDay">${icon('scale')}Rebalance day</button>`:''}
    </div>
    <div class="days" role="tablist">${p.days.map((d,i)=>`<button class="day ${i===S.ui.day?'on':''}" role="tab" aria-selected="${i===S.ui.day}" data-act="day" data-i="${i}">Plan ${i+1}</button>`).join('')}
      <button class="btn btn-ghost btn-sm" data-act="addDay" title="Generate another meal plan that hits the same targets with different meals">${icon('plus')}Add meal plan</button>
      <span style="flex:1"></span>
      <button class="btn btn-ghost btn-sm" data-act="regenDay" title="Replace every meal in this plan">${icon('refresh')}<span class="hide-s">Regenerate</span></button>
      ${p.days.length>1?`<button class="iconbtn" data-act="delDay" title="Remove this meal plan">${icon('x')}</button>`:''}
    </div>
  </div>
  <div class="bwrap">
    <aside class="lcol">
      <div><h4>Daily targets</h4>
        <div class="tgrid">${[['k','kcal'],['p','P g'],['c','C g'],['f','F g']].map(([k,u])=>`<div class="tin"><input class="input num" type="number" inputmode="numeric" data-tdraft="${k}" value="${Math.round(td[k])}" aria-label="${u}"><span>${u}</span></div>`).join('')}</div>
        ${tdirty?`<button class="btn btn-primary btn-sm" style="margin-top:10px;width:100%" data-act="applyTargets">Apply to every plan</button><button class="btn btn-ghost btn-sm" style="margin-top:4px;width:100%" data-act="cancelTargets">Cancel</button>`:`<p class="hint" style="margin-top:8px">Change a number to re-portion every meal.</p>`}
      </div>
      <div class="rules"><h4>Food rules</h4>
        <div class="t2" style="font-size:13px">${rulesSummary({...p.rules,dislikes:[]})||'No diet or allergy rules'}</div>
        ${chipInput('plan.dislikes','Avoid a food',p.rules.dislikes,'e.g. salmon')}
        <p class="hint">Adding a food here removes it from every meal in the plan.</p>
      </div>
    </aside>
    <section class="meals">
      ${day.meals.map((m,i)=>mealHTML(p,day,m,i)).join('')}
      <button class="addmeal" data-act="addMeal">${icon('plus')}Add a snack</button>
    </section>
  </div>`;
}
function variantCount(p,m){return candidates(m.type,S.data.favorites).filter(c=>c.id!==m.src&&adapt(c.items,p.rules)).length;}
function mealHTML(p,day,m,mi){
  const T=mealT(p,m),mm=macros(m.items),st=status(mm,T),fav=isFav(m),vc=variantCount(p,m);
  const dk=Math.round(mm.k-T.k);
  const rows=m.items.map((it,ii)=>{const f=FOODS[it.fid],q=it.g/100;
    return `<div class="irow ${S.ui.flash===m.id+':'+ii?'flash':''}">
      <div class="food"><span class="rdot" style="--c:var(--${ROLE_COLOR[f.role]})"></span><span class="fname">${esc(f.name)}</span><span class="uh">${unitHint(it)}</span></div>
      <div class="gin-w"><input class="gin num" inputmode="numeric" value="${Math.round(it.g)}" data-grams="${mi}:${ii}" aria-label="Grams of ${esc(f.name)}"><span>g</span></div>
      <div class="c k num">${r1(f.k*q)}</div><div class="c m num">${r1(f.p*q)}</div><div class="c m num">${r1(f.c*q)}</div><div class="c m num">${r1(f.f*q)}</div>
      <div class="ra"><button class="iconbtn swapi" data-act="swapItem" data-m="${mi}" data-i="${ii}" title="Swap ${esc(f.name)}">${icon('swap')}</button><button class="iconbtn ${it.locked?'on':''}" data-act="lock" data-m="${mi}" data-i="${ii}" title="${it.locked?'Unlock: let the solver adjust this portion':'Lock this portion'}" aria-pressed="${!!it.locked}">${icon(it.locked?'lock':'unlock')}</button><button class="iconbtn" data-act="rmItem" data-m="${mi}" data-i="${ii}" title="Remove">${icon('x')}</button></div>
    </div>`;}).join('');
  return `<article class="meal ${S.ui.flash===m.id?'flash':''}" data-meal="${mi}">
    <header class="meal-h">
      <div class="meal-t"><div class="slot">${slotLabel(p,day,mi)}</div><h3>${esc(m.name)}</h3></div>
      <div class="meal-m num"><span class="kc"><b>${fmt(mm.k)}</b> kcal</span><span>P <b>${r1(mm.p)}</b></span><span>C <b>${r1(mm.c)}</b></span><span>F <b>${r1(mm.f)}</b></span></div>
      <div class="meal-a">
        <button class="btn btn-secondary btn-sm" data-act="swapMeal" data-m="${mi}" title="Explore ${vc} variants (S)">${icon('swap')}Swap meal<span class="cntp">${vc}</span></button>
        <button class="iconbtn" data-act="nextMeal" data-m="${mi}" title="Next best option (N)">${icon('shuffle')}</button>
        <button class="iconbtn ${fav?'on':''}" data-act="fav" data-m="${mi}" title="${fav?'Remove from saved meals':'Save meal for reuse'}" aria-pressed="${fav}">${icon(fav?'star-fill':'star')}</button>

    <div class="items">${m.items.length?`<div class="irow head"><div>Ingredient</div><div style="text-align:right">Amount</div><div class="c">kcal</div><div class="c m">P</div><div class="c m">C</div><div class="c m">F</div><div></div></div>${rows}`:`<div class="empty" style="padding:22px"><p>No meal fits these food rules. Open <b>Swap meal</b> to pick one, or loosen a rule.</p></div>`}</div>
    <footer class="meal-f">
      <button class="btn btn-ghost btn-sm" data-act="addItem" data-m="${mi}">${icon('plus')}Add ingredient</button>
      ${st!=='ok'&&m.items.length?`<span class="offnote ${st==='off'?'off':''}"><span class="sdot ${st}"></span>${dk>0?'+':''}${fmt(dk)} kcal vs. target ${fmt(T.k)}</span><button class="btn btn-secondary btn-sm" data-act="rebalance" data-m="${mi}">${icon('scale')}Rebalance</button>`:`<span class="hint" style="margin-left:auto">Target ${fmt(T.k)} kcal, P ${r1(T.p)}</span>`}
    </footer>
