/* ---------------- Variant map ---------------- */
function comp(m){const k=Math.max(m.p*4+m.c*4+m.f*9,1);return {x:m.c*4/k,y:m.p*4/k};}
function vmap(points,cur,tgt,{w=420,h=210,act='pickMeal',xl='carbs',yl='protein'}={}){
  const all=points.concat(cur?[cur]:[],tgt?[tgt]:[]);if(!all.length)return '';
  let x0=Math.min(...all.map(p=>p.x)),x1=Math.max(...all.map(p=>p.x)),y0=Math.min(...all.map(p=>p.y)),y1=Math.max(...all.map(p=>p.y));
  const sx=Math.max(x1-x0,.12),sy=Math.max(y1-y0,.12),cx=(x0+x1)/2,cy=(y0+y1)/2;x0=cx-sx*.6;x1=cx+sx*.6;y0=cy-sy*.6;y1=cy+sy*.6;
  const pd=18,X=v=>pd+(v-x0)/(x1-x0)*(w-2*pd),Y=v=>h-pd-(v-y0)/(y1-y0)*(h-2*pd);
  let g='';for(let i=1;i<6;i++){g+=`<line class="gl" x1="${w*i/6}" y1="0" x2="${w*i/6}" y2="${h}"/>`;}for(let i=1;i<4;i++){g+=`<line class="gl" x1="0" y1="${h*i/4}" x2="${w}" y2="${h*i/4}"/>`;}
  const tg=tgt?`<line class="tgt" x1="${X(tgt.x)}" y1="0" x2="${X(tgt.x)}" y2="${h}"/><line class="tgt" x1="0" y1="${Y(tgt.y)}" x2="${w}" y2="${Y(tgt.y)}"/><text x="${X(tgt.x)+5}" y="12">target</text>`:'';
  const dots=points.map(p=>`<g data-k="${p.k}" data-act="${act}"><circle class="halo" cx="${X(p.x)}" cy="${Y(p.y)}" r="10"/><circle class="d" cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.r||4.5}"/><title>${esc(p.label)}</title></g>`).join('');
  const cu=cur?`<circle class="curr" cx="${X(cur.x)}" cy="${Y(cur.y)}" r="9"/><circle class="cur" cx="${X(cur.x)}" cy="${Y(cur.y)}" r="4.5"/><text x="${X(cur.x)+12}" y="${Y(cur.y)+4}" style="fill:var(--hl-ink)">current</text>`:'';
  return `<svg class="vmap" viewBox="0 0 ${w} ${h}" role="img" aria-label="Map of alternatives by macro composition">${g}${tg}${dots}${cu}<text x="${w-pd}" y="${h-6}" text-anchor="end">more ${xl} →</text><text x="6" y="${h-6}" transform="rotate(-90 6 ${h-6})" dx="${pd}">more ${yl} →</text></svg>`;
}

/* ---------------- Side panel (swaps) ---------------- */
function renderPanel(){
  const root=document.getElementById('panel-root'),pn=S.ui.panel,p=curPlan();
  const {parts}=parse();
  if(!pn||!p||parts[1]!=='plan'){root.innerHTML='';return;}
  const day=p.days[S.ui.day],meal=day.meals[pn.m];
  if(!meal){S.ui.panel=null;root.innerHTML='';return;}
  const T=mealT(p,meal),anim=pn.anim?'anim':'';pn.anim=false;
  let head='',body='';
  const macRow=(m,err)=>{const s=status(m,T);const dk=Math.round(m.k-T.k);return `<div class="mac num"><span><b>${fmt(m.k)}</b> kcal</span><span>P <b>${r1(m.p)}</b></span><span>C <b>${r1(m.c)}</b></span><span>F <b>${r1(m.f)}</b></span><span class="fit"><span class="sdot ${s==='ok'?'':s}"></span>${s==='ok'?'On target':`${dk>0?'+':''}${dk} kcal`}</span></div>`;};
  if(pn.kind==='meal'){
    const favs=S.data.favorites;
    const alts=mealAlternatives(p,day,meal,favs,pn.filter);S.ui.alts=alts;
    const cats=CATS.filter(c=>candidates(meal.type,favs).some(x=>{const a=adapt(x.items,p.rules);return a&&catOf(a.items)===c;}));
    const map=vmap(alts.map((a,k)=>({...comp(a.m),k,label:a.name,r:3+Math.max(0,3-a.err*40)})),comp(macros(meal.items)),comp(T));
    head=`<div class="top"><div style="flex:1"><h2>Variant space: ${esc(slotLabel(p,day,pn.m).toLowerCase())}</h2><div class="sub num">${alts.length} variants, each re-solved to ${fmt(T.k)} kcal, P ${r1(T.p)} g</div></div><button class="iconbtn" data-act="closePanel" title="Close (Esc)">${icon('x')}</button></div>
      <div class="chips">${[['all','All'],...cats.map(c=>[c,c]),...(favs.some(f=>f.type===meal.type)?[['saved','Saved']]:[])].map(([k,t])=>`<button class="chip ${pn.filter===k?'on':''}" data-act="pfilter" data-v="${k}">${t}</button>`).join('')}</div><div style="margin-top:14px">${map}</div>`;
    body=alts.length?alts.map((a,k)=>`<button class="alt" data-act="pickMeal" data-k="${k}" data-kk="${k}"><div class="l1"><span class="nm">${esc(a.name)}${a.src==='fav'?' <span class="badge">Saved</span>':''}</span><span class="muted" style="font-size:12px">${catOf(a.items)||''}</span></div><div class="ingr">${a.items.map(x=>`${esc(FOODS[x.fid].name.split(',')[0])} ${Math.round(x.g)} g`).join(', ')}</div>${macRow(a.m)}</button>`).join(''):`<div class="empty"><h3>Nothing here</h3><p>No ${pn.filter==='saved'?'saved':esc(pn.filter).toLowerCase()} meals fit this client's food rules.</p></div>`;
  }else if(pn.kind==='item'){
    const it=meal.items[pn.i];if(!it){S.ui.panel=null;root.innerHTML='';return;}
    const f=FOODS[it.fid];
    const alts=itemAlternatives(p,meal,pn.i,pn.mode,pn.q);S.ui.alts=alts;
    const fmap=vmap(alts.map((a,k)=>({...comp(FOODS[a.fid]),k,label:FOODS[a.fid].name})),comp(f),null,{act:'pickItem',h:170});
    head=`<div class="top"><div style="flex:1"><h2>Food space: ${esc(f.name.split(',')[0].toLowerCase())}</h2><div class="sub num">${Math.round(it.g)} g in ${esc(meal.name)}, ${alts.length} neighbors</div></div><button class="iconbtn" data-act="closePanel" title="Close (Esc)">${icon('x')}</button></div>
      <div style="display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap">${`<div class="seg"><button class="${pn.mode==='rebalance'?'on':''}" data-act="pmode" data-v="rebalance">Keep meal on target</button><button class="${pn.mode==='match'?'on':''}" data-act="pmode" data-v="match">Swap this item only</button></div>`}</div>

function mutate(fn,msg,flash){
  const p=curPlan();if(!p)return;
  S.ui.hist.past.push(JSON.stringify(p));if(S.ui.hist.past.length>80)S.ui.hist.past.shift();S.ui.hist.future=[];
  fn(p);p.updatedAt=Date.now();save();
  if(flash)S.ui.flash=flash;
  render();if(msg)toast(msg,true);
}
function replacePlan(np){const i=S.data.plans.findIndex(x=>x.id===np.id);if(i>=0)S.data.plans[i]=np;}
function undo(){const h=S.ui.hist,p=curPlan();if(!h.past.length||!p)return;h.future.push(JSON.stringify(p));replacePlan(JSON.parse(h.past.pop()));save();S.ui.panel=null;render();toast('Undone');}
function redo(){const h=S.ui.hist,p=curPlan();if(!h.future.length||!p)return;h.past.push(JSON.stringify(p));replacePlan(JSON.parse(h.future.pop()));save();render();toast('Redone');}
function rebalanceMeal(p,m){if(m.items.length)m.items=solve(m.items,mealT(p,m));}
function renormalize(day){const s=day.meals.reduce((a,m)=>a+m.share,0)||1;day.meals.forEach(m=>m.share/=s);}
function applyMeal(m,alt){m.name=alt.name;m.src=alt.id;m.items=alt.items.map(x=>({fid:x.fid,g:x.g,locked:false}));m.notes=alt.notes||[];}
function purgeDisallowed(p){
  let n=0;
  p.days.forEach(d=>d.meals.forEach(m=>{
    if(m.items.every(it=>allowed(FOODS[it.fid],p.rules)))return;
    const ad=adapt(m.items,p.rules);
    if(ad){m.items=solve(ad.items.map(x=>({...x,locked:false})),mealT(p,m));m.notes=(m.notes||[]).concat(ad.notes);}
    else{const alts=mealAlternatives(p,d,m,S.data.favorites,'all');if(alts[0])applyMeal(m,alts[0]);else m.items=[];}
    n++;
  }));
  return n;
}

function runGeneration(opts,label){

  const pool=plan.days[0].meals.reduce((a,m)=>a+candidates(m.type,S.data.favorites).length,0),ok=plan.days[0].meals.reduce((a,m)=>a+variantCount(plan,m)+1,0);
  const t=macros(plan.days[0].meals.flatMap(m=>m.items)),dev=Math.abs(t.k-plan.targets.k)/plan.targets.k*100;
  const lines=[`<b>›</b> targets <span class="v">${fmt(plan.targets.k)} kcal, P ${plan.targets.p} C ${plan.targets.c} F ${plan.targets.f}</span>`,
    `<b>›</b> constraints <span class="v">${rc} applied</span>${rc?` (${esc(rulesSummary(r))})`:''}`,

    `<b>›</b> solving portions <span class="v">${plan.days.length} plan${plan.days.length>1?'s':''}, ${plan.days[0].meals.length} meals each</span>`,
    `<b>›</b> day total <span class="v">${fmt(t.k)} kcal</span>, deviation <span class="v">${dev.toFixed(1)}%</span>`,
    `<b>✓</b> solved in <span class="v">${ms} ms</span>`];
  const mr=document.getElementById('modal-root');

  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,dt=reduce?0:110;

      <dl class="msg">
        <dt>Slogan</dt><dd class="display" style="font-size:28px">Built in milliseconds.</dd>
        <dt>Brand idea</dt><dd>Nutrition, calculated fast.</dd>
        <dt>Homepage headline</dt><dd>Your macros. Your meals. In seconds.</dd>
        <dt>Subheadline</dt><dd>Set the targets. Get a full day of meals, with an instant swap for every one.</dd>
        <dt>Primary CTA</dt><dd>Build a plan</dd>
        <dt>Positioning</dt><dd>For nutrition coaches, Macrospace turns calorie and macro targets into a complete meal plan in milliseconds, and lets any meal or ingredient be swapped without breaking the numbers.</dd>
        <dt>Value propositions</dt><dd><b>Fast.</b> A full, portioned day in milliseconds.<br><b>Meal swaps.</b> Alternatives arrive portioned to the same calories.<br><b>Ingredient swaps.</b> Grams adjust to keep the macro that matters.<br><b>Food rules.</b> Allergies and dislikes apply to every meal and swap.</dd>
        <dt>Short description</dt><dd>Meal-plan software for coaches: macro-accurate plans in milliseconds, and one-click swaps for any meal or ingredient.</dd>
        <dt>One-sentence pitch</dt><dd>Macrospace builds your client's meal plan in milliseconds and lets you swap anything in it without breaking the macros.</dd>
      </dl>
    </section>

    <section class="bsec"><h2>Color</h2><p>Everything is neutral until the important thing turns lime. Lime marks actions, selected states, on-target numbers and speed. It never carries text on white; lime ink does that. The website is light-first; the workspace and dark mode use the same system on near-black.</p>
      <div class="sw">
        ${sw('Paper','#FFFFFF','Website background')}${sw('Mist','#F7F8F9','Subtle fills, totals rows')}${sw('Line','#E6E8EC','Borders, dividers')}${sw('Line strong','#D5D9DF','Inputs, secondary buttons')}
        ${sw('Ink','#0B0E14','Primary text')}${sw('Slate','#4A5260','Body text')}${sw('Stone','#5F6977','Captions, labels')}
        ${sw('Lime','#B6F23A','Actions, signal')}${sw('Lime hover','#A7E329','Hover')}${sw('Lime wash','#EFF8DD','Selected, just changed')}${sw('Lime ink','#3F6B00','Text on lime wash')}
        ${sw('Void','#07090D','Dark background')}${sw('Panel','#0D1117','Dark surfaces')}${sw('Signal','#E8ECF2','Dark primary text')}
      </div>
      <p class="hint" style="margin-top:14px">Protein, carb and fat colors appear only on data inside the workspace. No gradients; depth comes from one shadow on product windows.</p>
    </section>

    <section class="bsec"><h2>Typography and layout</h2><p>Geist for everything, set tight in headlines. Geist Mono for numbers, so values line up like instrument output.</p>
      <div class="box" style="padding:26px">
        <div class="display" style="font-size:52px;line-height:1.02">Built in milliseconds.</div><div class="hint" style="margin:6px 0 22px">H1 64 / H2 40 / H3 18 / Body 17 / Caption 13</div>
        <div class="num" style="font-size:14px"><b>1,796</b> / 1,800 kcal  P 129  C 197  F 58</div><div class="hint" style="margin-top:4px">Numbers, Geist Mono</div>
      </div>
      <p class="hint" style="margin-top:12px">Grid: 12 columns, 1200 px content, 24 px gutters. Spacing: 8, 12, 16, 24, 32, 48, 64, 96, 128. Sections: 128 px apart on desktop, 96 tablet, 64 mobile. Radius: 8 for controls, 12 for cards. Buttons: one height, 44 px.</p>
    </section>

    <section class="bsec"><h2>Components</h2><p>Live components from the workspace.</p>
      <div class="box" style="padding:24px;display:flex;flex-direction:column;gap:22px">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn btn-primary">Generate plan</button><button class="btn btn-secondary">${icon('swap')}Swap meal<span class="cntp">14</span></button><button class="btn btn-ghost">${icon('plus')}Add ingredient</button><button class="btn btn-primary" disabled>Disabled</button><button class="iconbtn">${icon('shuffle')}</button></div>
        <div class="grid3"><div class="field"><label>Weight</label><div class="tin"><input class="input num" value="64"><span>kg</span></div></div><div class="field"><label>With error</label><input class="input err" value="12"><div class="errmsg">Enter an age between 14 and 100.</div></div><div class="field"><span class="lbl">Activity</span><div class="seg"><button class="on">Moderate</button><button>Athlete</button></div></div></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="chip on">Gluten</span><span class="chip">Dairy</span><span class="tag">Tuna in water<button>${icon('x')}</button></span><span class="badge draft">Draft</span><span class="badge approved">Approved</span></div>
        <div style="display:flex;gap:20px;flex-wrap:wrap">${meter('Protein',118,128,'protein')}${meter('Carbs',190,181,'carbs')}${meter('Fat',44,50,'fat')}</div>
      </div>
      <p class="hint" style="margin-top:12px">Voice: say what happened, with numbers (“Plan ready. 4 meals, 0.4% off target.”). Errors state the cause and the fix.</p>
    </section>
  </div></div>`;
}

/* ---------------- boot ---------------- */
load();render();

/* ============================================================
   Apple design layer: fluid motion.
   Everything a person can touch moves on springs, so it can be grabbed and
   reversed mid-flight, starts from its live on-screen value, and inherits the
   finger's velocity on release. Panels, modals and toasts leave the way they came.
   ============================================================ */
(()=>{
const mq=q=>matchMedia(q).matches;
const reduced=()=>mq('(prefers-reduced-motion: reduce)');
const sheetMode=()=>mq('(max-width:760px)');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
// Where a flick comes to rest (Designing Fluid Interfaces). 0.998 = scroll-like deceleration.
const project=(v,d=.998)=>(v/1000)*d/(1-d);
// Progressive resistance past a boundary: responsive, but clearly nothing more there.
const rubber=(o,dim,c=.55)=>(o*dim*c)/(dim+c*Math.abs(o));

// Spring in Apple's terms: response (seconds to reach target, not a duration) and damping ratio (1 = no overshoot).
// Retargeting keeps position and velocity, so interruptions blend instead of hitting a wall.
class Spring{
  constructor(x,paint,eps){this.x=x;this.v=0;this.target=x;this.paint=paint;this.eps=eps;this.raf=0;this.done=null;this.step=this.step.bind(this);}
  to(target,{response=.4,damping=1,velocity,onDone}={}){
    this.target=target;if(velocity!==undefined)this.v=velocity;
    this.k=(2*Math.PI/response)**2;this.c=4*Math.PI*damping/response;this.done=onDone||null;
    if(!this.raf){this.last=performance.now();this.raf=requestAnimationFrame(this.step);}
  }
  step(now){
    let dt=Math.min(.05,(now-this.last)/1000);this.last=now;
    while(dt>1e-6){const h=Math.min(1/240,dt);this.v+=(-this.k*(this.x-this.target)-this.c*this.v)*h;this.x+=this.v*h;dt-=h;}
    if(Math.abs(this.x-this.target)<this.eps&&Math.abs(this.v)<this.eps*10){
      this.x=this.target;this.v=0;this.raf=0;this.paint(this.x);const d=this.done;this.done=null;if(d)d();return;}
    this.paint(this.x);this.raf=requestAnimationFrame(this.step);
  }
  set(x){cancelAnimationFrame(this.raf);this.raf=0;this.done=null;this.x=x;this.v=0;this.paint(x);}
}

// 1:1 drag along one axis. ~10px of hysteresis before committing, then the other gesture is dropped
// and the pointer is captured. Release velocity comes from the last ~100ms of movement.
let swallowClick=false;
window.addEventListener('click',e=>{if(swallowClick){e.stopPropagation();e.preventDefault();swallowClick=false;}},true);
function drag(e,axis,{start,move,end}){
  if(e.button!==0)return;
  const id=e.pointerId,x0=e.clientX,y0=e.clientY,el=e.target,hist=[];let on=false;
  const mv=ev=>{
    if(ev.pointerId!==id)return;
    const dx=ev.clientX-x0,dy=ev.clientY-y0;
    if(!on){
      if(Math.hypot(dx,dy)<10)return;
      if(axis==='x'?Math.abs(dx)<Math.abs(dy):Math.abs(dy)<Math.abs(dx)){off();return;}
      on=true;try{el.setPointerCapture(id);}catch(_){}document.documentElement.classList.add('fx-dragging');start();
    }
    const d=axis==='x'?dx:dy;hist.push([ev.timeStamp,d]);while(hist.length>2&&ev.timeStamp-hist[0][0]>100)hist.shift();
    move(d);
  };
  const up=ev=>{
    if(ev.pointerId!==id)return;off();if(!on)return;
    document.documentElement.classList.remove('fx-dragging');
    if(ev.type==='pointerup'){swallowClick=true;setTimeout(()=>{swallowClick=false;},0);}
    let v=0;const a=hist[0],b=hist[hist.length-1];
    if(a&&b&&b[0]-a[0]>8&&ev.timeStamp-b[0]<80)v=(b[1]-a[1])/((b[0]-a[0])/1000);
    end(v);
  };
  function off(){removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);}
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}

// Layers render by replacing innerHTML. Watch each root: when its surface disappears, keep the removed
// nodes alive in an inert ghost so they can exit along the path they came in on.
const fx=document.createElement('div');fx.id='fx-root';fx.setAttribute('aria-hidden','true');fx.inert=true;document.body.appendChild(fx);
function ghost(nodes){const w=document.createElement('div');w.className='fx-ghost';nodes.forEach(n=>w.appendChild(n));fx.appendChild(w);return w;}
function layer(root,sel,h){
  let had=!!root.querySelector(sel);
  new MutationObserver(recs=>{
    const now=root.querySelector(sel);
    if(now&&!had)h.open(now);
    else if(now)h.replace(now);
    else if(had){const gone=[];recs.forEach(r=>r.removedNodes.forEach(n=>{if(!n.isConnected&&!gone.includes(n))gone.push(n);}));h.close(ghost(gone));}
    had=!!now;
  }).observe(root,{childList:true});
}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8);}catch(_){}};

/* ---- Side panel: slides in from the right, leaves to the right, follows a swipe ---- */
const panelRoot=document.getElementById('panel-root');let pGhost=null;
const pw=()=>{const p=panelRoot.querySelector('.panel')||(pGhost&&pGhost.querySelector('.panel'));return (p&&p.offsetWidth)||460;};
const paintPanel=x=>{
  const w=pw(),prog=clamp(1-x/w,0,1),rm=reduced();
  for(const r of [panelRoot,pGhost]){if(!r)continue;const p=r.querySelector('.panel'),s=r.querySelector('.scrim');
    if(p){p.style.translate=rm?'':`${x}px 0`;p.style.opacity=rm?prog:'';}if(s)s.style.opacity=prog;}
};
const PS=new Spring(0,paintPanel,.5);
layer(panelRoot,'.panel',{
  open(){if(pGhost){pGhost.remove();pGhost=null;}else PS.set(pw());PS.to(0,{response:reduced()?.2:.38,damping:1});},
  replace(){paintPanel(PS.x);},
  close(g){if(pGhost)pGhost.remove();pGhost=g;PS.to(Math.max(pw(),PS.x),{response:reduced()?.2:.3,damping:1,onDone:()=>{if(pGhost===g){g.remove();pGhost=null;}}});}
});
panelRoot.addEventListener('pointerdown',e=>{
  if(!e.target.closest('.panel')||reduced()||e.target.closest('input,textarea,select,.vmap'))return;
  let base=0;
  drag(e,'x',{
    start(){base=PS.x;PS.set(PS.x);},
    move(d){const x=base+d;PS.set(x<0?-rubber(-x,pw()):x);},
    end(v){
      if(PS.x+project(v)>pw()/2&&v>-300){PS.v=v;buzz();ACT.closePanel();}
      else PS.to(0,{velocity:v,response:.3,damping:.8});
    }
  });
});

/* ---- Modal: grows from the control that opened it and shrinks back into it; on phones a sheet you pull down ---- */
const modalRoot=document.getElementById('modal-root');let mGhost=null,lastDown=null;
document.addEventListener('pointerdown',e=>{lastDown={x:e.clientX,y:e.clientY,t:performance.now()};},true);
const paintModal=p=>{
  const q=clamp(p,0,1),rm=reduced(),sheet=sheetMode();
  for(const r of [modalRoot,mGhost]){if(!r)continue;const w=r.querySelector('.modal-w'),m=w&&w.querySelector('.modal');if(!m)continue;
    w.style.setProperty('--fxp',q);
    if(rm){m.style.opacity=q;m.style.translate=m.style.scale=m.style.filter='';}
    else if(sheet){m.style.translate=`0 ${(1-p)*(m.offsetHeight||400)}px`;m.style.opacity=m.style.scale=m.style.filter='';}
    else{m.style.scale=.94+.06*q;m.style.opacity=q;m.style.filter=q>.995?'':`blur(${(1-q)*6}px)`;m.style.translate='';}
  }
};
const MS=new Spring(1,paintModal,.001);
layer(modalRoot,'.modal-w',{
  open(w){
    if(mGhost){mGhost.remove();mGhost=null;}
    else{const m=w.querySelector('.modal');
      if(m&&!sheetMode()&&lastDown&&performance.now()-lastDown.t<1000){const r=m.getBoundingClientRect();m.style.transformOrigin=`${lastDown.x-r.left}px ${lastDown.y-r.top}px`;}
      MS.set(0);}
    MS.to(1,{response:reduced()?.2:sheetMode()?.4:.32,damping:1});
  },
  replace(){paintModal(MS.x);},
  close(g){if(mGhost)mGhost.remove();mGhost=g;MS.to(Math.min(0,MS.x),{response:reduced()?.2:.28,damping:1,onDone:()=>{if(mGhost===g){g.remove();mGhost=null;}}});}
});
modalRoot.addEventListener('pointerdown',e=>{
  const w=e.target.closest('.modal-w'),m=e.target.closest('.modal');
  if(!m||!w||!w.matches('[data-act="closeModal"]')||!sheetMode()||reduced())return;
  if(!(e.target===m||e.target.closest('.modal-h'))||e.target.closest('button,input,select,textarea'))return;
  const h=m.offsetHeight||400;let base=1;
  drag(e,'y',{
    start(){base=MS.x;MS.set(MS.x);},
    move(d){const y=(1-base)*h+d;MS.set(y<0?1+rubber(-y,h)/h:1-y/h);},
    end(v){const y=(1-MS.x)*h;
      if(y+project(v)>h*.4&&v>-300){MS.v=-v/h;buzz();closeModal();}
      else MS.to(1,{velocity:-v/h,response:.3,damping:.8});}
  });
});

/* ---- Toast: rises from the bottom edge and sinks back; swipe down to dismiss ---- */
const toastRoot=document.getElementById('toast-root');let tGhost=null;const TD=28;
const paintToast=p=>{
  const q=clamp(p,0,1),rm=reduced();
  for(const r of [toastRoot,tGhost]){if(!r)continue;const t=r.querySelector('.toast');if(!t)continue;
    t.style.opacity=q;t.style.translate=rm?'':`0 ${(1-p)*TD}px`;t.style.scale=rm?'':.96+.04*q;}
};
const TS=new Spring(1,paintToast,.001);
layer(toastRoot,'.toast',{
  open(){if(tGhost){tGhost.remove();tGhost=null;}else TS.set(0);TS.to(1,{response:reduced()?.2:.36,damping:1});},
  replace(){paintToast(TS.x);},
  close(g){if(tGhost)tGhost.remove();tGhost=g;TS.to(TS.x<0?TS.x-1:0,{response:reduced()?.2:.3,damping:1,onDone:()=>{if(tGhost===g){g.remove();tGhost=null;}}});}
});
toastRoot.addEventListener('pointerdown',e=>{
  if(!e.target.closest('.toast')||e.target.closest('button')||reduced())return;
  let base=1;
  drag(e,'y',{
    start(){base=TS.x;TS.set(TS.x);clearTimeout(toastT);},
    move(d){const y=(1-base)*TD+d;TS.set(y<0?1+rubber(-y,TD*3)/TD:1-y/TD);},
    end(v){const y=(1-TS.x)*TD;
      if(y+project(v)>TD){TS.v=-v/TD;toastRoot.innerHTML='';}
      else{TS.to(1,{velocity:-v/TD,response:.3,damping:.8});toastT=setTimeout(()=>{toastRoot.innerHTML='';},2500);}}
  });
});

/* ---- Scroll edge: chrome shows a hairline only once content actually sits under it ---- */
const onScroll=()=>document.documentElement.classList.toggle('fx-scrolled',scrollY>4);
addEventListener('scroll',onScroll,{passive:true});onScroll();

/* ---- Theme changes cross-fade instead of flashing ---- */
const baseApplyTheme=applyTheme;let themeT=0;
applyTheme=function(t){const h=document.documentElement;h.classList.add('fx-theming');baseApplyTheme(t);clearTimeout(themeT);themeT=setTimeout(()=>h.classList.remove('fx-theming'),400);};
})();
</script>
