<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Export Trial</title>
<style>
  /* Tokens from public/css/styles.css (light theme). */
  :root {
    --ink: #0A0F24; --ink-2: #111A40;
    --lime: #B6F23A; --lime-soft: #EEF8D8; --accent: #3F6B00;
    --bg: #F3F6FB; --surface: #FFFFFF; --subtle: #F6F8FC; --border: #E2E8F2;
    --text: #0A0F24; --text-2: #465069; --text-3: #7A84A0;
    --mx-p: #3F7A00; --mx-c: #B6F23A; --mx-f: #F2B33D;
    --tx-p: #3F7A00; --tx-c: #557A10; --tx-f: #B76E00;
    --ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, Roboto, 'Helvetica Neue', sans-serif;
    --display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, Roboto, sans-serif;
    /* Shared numeric columns: portion, kcal, protein, carbs, fat. */
    --cols: minmax(0, 1fr) repeat(5, 84px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #C9D1E2; }
  body { font-family: var(--ui); color: var(--text); padding: 20px 16px 32px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { size: A4; margin: 0; }
  @media print { html, body { background: none; padding: 0; } .demo { display: none; } .page { box-shadow: none !important; margin: 0 !important; } }

  /* Trial-only switch, not part of the export. */
  .demo { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; font: 600 13px var(--ui); }
  .demo button { font: inherit; padding: 8px 14px; border-radius: 99px; border: 1px solid #AEB8CF; background: #fff; color: var(--text-2); cursor: pointer; }
  .demo button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* One A4 sheet at 96dpi. Content scales down to fit; it never spills. */
  .page {
    width: 794px; height: 1123px; margin: 0 auto; position: relative; overflow: hidden;
    background: var(--bg); box-shadow: 0 30px 80px -30px rgba(10,15,36,.45);
  }
  .fit { width: 794px; padding: 30px 34px 24px; transform-origin: top left; }

  /* Watermark: drawn above everything at very low opacity so it shows through cards. */
  .watermark {
    position: absolute; left: 50%; top: 58%; width: 460px; height: 460px;
    transform: translate(-50%, -50%) rotate(-14deg);
    opacity: .035; pointer-events: none; z-index: 10;
  }

  /* ── Hero ── */
  .hero {
    position: relative; overflow: hidden; border-radius: 22px; color: #fff;
    background:
      radial-gradient(400px 240px at 95% 0%, rgba(182,242,58,.26), transparent 65%),
      linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 100%);
    padding: 24px 28px 26px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 14px; letter-spacing: -.01em; }
  .brand svg { width: 24px; height: 24px; }
  .eyebrow { margin-top: 26px; font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--lime); }
  .client { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1.04; letter-spacing: -.035em; margin-top: 6px; text-wrap: balance; }
  .client em { font-style: normal; color: var(--lime); }
  .meta { margin-top: 12px; font-size: 12.5px; color: #A9B3D1; font-weight: 500; }
  .meta b { color: #fff; font-weight: 600; }
  .meta .goal { display: inline-block; padding: 3px 10px; margin-right: 8px; border-radius: 99px; background: var(--lime); color: var(--ink); font-weight: 700; font-size: 11.5px; }

  .ring { position: relative; width: 150px; height: 150px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .num b { font-family: var(--display); font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .ring .num span { font-size: 10px; color: #A9B3D1; margin-top: 5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }

  /* ── Daily macros ── */
  .macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0 18px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px 13px; }
  .tile-top { display: flex; align-items: baseline; justify-content: space-between; }
  .tile .lbl { font-size: 11.5px; color: var(--text-3); font-weight: 600; }
  .tile .lbl i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 6px; }
  .tile .val { font-family: var(--display); font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
  .tile .val small { font-size: 12px; font-weight: 600; color: var(--text-3); margin-left: 1px; }
  .tile .val span { font-size: 11px; font-weight: 600; color: var(--text-3); margin-left: 6px; letter-spacing: 0; }
  .tile .bar { margin-top: 9px; height: 5px; border-radius: 5px; background: #EDF1F7; overflow: hidden; }
  .tile .bar i { display: block; height: 100%; border-radius: 5px; }

  /* ── Meals: one per row, one shared column grid ── */
  .table-head {
    display: grid; grid-template-columns: var(--cols); margin: 22px 0 6px; padding: 0 18px;
    font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3);
  }
  .table-head > :not(:first-child) { text-align: right; }
  .meal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; position: relative; }
  .meal + .meal { margin-top: 10px; }
  .meal::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--m); }
  .row { display: grid; grid-template-columns: var(--cols); align-items: center; padding: 0 18px; }
  .row > :not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  .meal-head { height: 50px; background: var(--m-soft); }
  /* Every meal labels its own columns, so no scrolling up to check. */
  .meal-head .n { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .meal-head .n em { font-style: normal; font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .meal-title { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 750; letter-spacing: -.01em; }
  .meal-title svg { width: 18px; height: 18px; fill: none; stroke: var(--m-ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .meal-head .n { font-size: 12.5px; font-weight: 800; }
  .meal-head .k { color: var(--m-ink); }
  .item { height: 40px; font-size: 12.5px; }
  .item + .item { border-top: 1px solid #EEF1F6; }
  .food { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .food img { width: 28px; height: 28px; border-radius: 50%; flex: none; background: var(--subtle); }
  .food span { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .food span small { font-size: inherit; font-weight: 400; color: var(--text-3); }
  .item .g { font-weight: 800; }
  .item .g small, .meal-head small { font-size: 10px; font-weight: 600; color: var(--text-3); margin-left: 1px; }
  .item .k { color: var(--text-2); }
  .p { color: var(--tx-p); } .c { color: var(--tx-c); } .f { color: var(--tx-f); }

  /* ── Footer ── */
  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 10px; color: var(--text-3); font-weight: 600; }
  .foot .brand { font-size: 11px; color: var(--text); gap: 7px; }
  .foot .brand svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<div class="demo" role="group" aria-label="Trial switch">
  <button type="button" data-mode="client" aria-pressed="true">Client name typed</button>
  <button type="button" data-mode="general" aria-pressed="false">No client name</button>
</div>

<div class="page" id="page">
  <svg class="watermark" aria-hidden="true" style="--logo-tile:#0A0F24;--logo-ink:#F3F6FB"><use href="#logo"/></svg>

  <div class="fit" id="fit">
    <header class="hero">
      <div>
        <div class="brand"><svg><use href="#logo"/></svg>macrospace</div>
        <div class="eyebrow" id="eyebrow"></div>
        <h1 class="client" id="title"></h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="ring">
        <svg viewBox="0 0 120 120" id="ring"></svg>
        <div class="num"><b id="kcal"></b><span>kcal / day</span></div>
      </div>
    </header>

    <section class="macros" id="macros"></section>

    <section id="meals"></section>

    <footer class="foot">
      <div class="brand"><svg><use href="#logo"/></svg>macrospace</div>
      <div id="foot-date"></div>
      <div>Page 1 of 1</div>
    </footer>
  </div>
</div>

        <div class="n k"><em>Kcal</em><span>${r(t.k)}</span></div>
        <div class="n p"><em>Protein</em><span>${r(t.p)}g</span></div>
        <div class="n c"><em>Carbs</em><span>${r(t.c)}g</span></div>
        <div class="n f"><em>Fat</em><span>${r(t.f)}g</span></div>
      </div>
      ${items}
    </article>`;
  }).join('');

  // Always one page: shrink the content to fit, widening it as it shrinks so
  // the scaled page still fills the sheet.
  function fit() {
    const page = document.getElementById('page'), box = document.getElementById('fit');
    box.style.transform = 'none';
    let s = 1;
    for (let i = 0; i < 4; i++) {
      box.style.width = `${794 / s}px`;
      s = Math.min(1, page.clientHeight / box.scrollHeight);
    }
    box.style.width = `${794 / s}px`;
    box.style.transform = `scale(${s})`;
  }

  document.querySelectorAll('.demo button').forEach((btn) => btn.addEventListener('click', () => {
    document.querySelectorAll('.demo button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
    renderHero(btn.dataset.mode);
  }));
  renderHero('client');
  window.addEventListener('load', fit);
</script>
</body>
</html>
