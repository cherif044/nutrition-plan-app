<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Log in — Pinch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-card__brand">
          <p class="eyebrow">Pinch</p>
          <h1>Nutrition Plan</h1>
        </div>

        <h2>Welcome back</h2>
        <p class="auth-subtitle">Log in to access your nutrition planner.</p>

        <form class="auth-form" id="login-form" novalidate>
          <label>
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" autocapitalize="none" spellcheck="false" required />
            <span class="field-hint" data-hint="email"></span>
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required />
            <span class="field-hint" data-hint="password"></span>
          </label>
          <button class="auth-link-button" id="forgot-password-btn" type="button">Forgot password?</button>

          <button class="auth-submit" type="submit">
            <span>Log in</span>
          </button>
          <div class="auth-divider"><span>or</span></div>
          <button class="auth-google" id="google-auth-btn" type="button">
            <span class="auth-google__mark" aria-hidden="true">
              <svg viewBox="0 0 18 18" focusable="false">
                <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.26-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.58 2.68-3.9 2.68-6.62Z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.33-1.58-5.04-3.7H.94v2.33A9 9 0 0 0 9 18Z"/>
                <path fill="#FBBC05" d="M3.96 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.94a9 9 0 0 0 0 8.1l3.02-2.33Z"/>
                <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.34l2.58-2.58A8.64 8.64 0 0 0 9 0 9 9 0 0 0 .94 4.95l3.02 2.33C4.67 5.16 6.66 3.58 9 3.58Z"/>
              </svg>
            </span>
            <span>Continue with Google</span>
          </button>
          <button class="auth-link-button auth-link-button--center" id="resend-verification-btn" type="button" hidden>
            Resend verification email
          </button>
          <p class="auth-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <form class="auth-form" id="forgot-form" hidden novalidate>
          <label>
            <span>Email</span>
            <input type="email" id="forgot-email" autocomplete="email" autocapitalize="none" spellcheck="false" required />
          </label>
          <button class="auth-submit" type="submit">
            <span>Send reset link</span>
          </button>
          <button class="auth-link-button auth-link-button--center" id="back-to-login-btn" type="button">Back to login</button>
        </form>

        <p class="auth-switch">
          Don&rsquo;t have an account?
          <a href="/register">Create one</a>
        </p>
        <p class="auth-switch">
          <a href="/">&#8592; Back to home</a>
        </p>
      </div>
    </div>

    <script src="/js/auth.js" defer></script>
  </body>
</html>
