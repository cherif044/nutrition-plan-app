<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Log in — Pinch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-card__brand">
          <p class="eyebrow">Pinch</p>
          <h1>Nutrition Plan</h1>
        </div>

        <h2>Welcome back</h2>
        <p class="auth-subtitle">Log in to access your nutrition planner.</p>

        <form class="auth-form" id="login-form" novalidate>
          <label>
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" autocapitalize="none" spellcheck="false" required />
            <span class="field-hint" data-hint="email"></span>
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required />
            <span class="field-hint" data-hint="password"></span>
          </label>
          <button class="auth-link-button" id="forgot-password-btn" type="button">Forgot password?</button>

          <button class="auth-submit" type="submit">
            <span>Log in</span>
          </button>
          <div class="auth-divider"><span>or</span></div>
          <button class="auth-google" id="google-auth-btn" type="button">
            <span class="auth-google__mark" aria-hidden="true">G</span>
            <span>Continue with Google</span>
          </button>
          <button class="auth-link-button auth-link-button--center" id="resend-verification-btn" type="button" hidden>
            Resend verification email
          </button>
          <p class="auth-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <form class="auth-form" id="forgot-form" hidden novalidate>
          <label>
            <span>Email</span>
            <input type="email" id="forgot-email" autocomplete="email" autocapitalize="none" spellcheck="false" required />
          </label>
          <button class="auth-submit" type="submit">
            <span>Send reset link</span>
          </button>
          <button class="auth-link-button auth-link-button--center" id="back-to-login-btn" type="button">Back to login</button>
        </form>

        <p class="auth-switch">
          Don&rsquo;t have an account?
          <a href="/register">Create one</a>
        </p>
        <p class="auth-switch">
          <a href="/">&#8592; Back to home</a>
        </p>
      </div>
    </div>

    <script src="/js/auth.js" defer></script>
  </body>
</html>
