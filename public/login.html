<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Log in — Pinch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-card__brand">
          <p class="eyebrow">Pinch</p>
          <h1>Nutrition Plan</h1>
        </div>

        <h2>Welcome back</h2>
        <p class="auth-subtitle">Log in to access your nutrition planner.</p>

        <form class="auth-form" id="login-form" novalidate>
          <label>
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required />
            <span class="field-hint" data-hint="username"></span>
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required />
            <span class="field-hint" data-hint="password"></span>
          </label>

          <button class="auth-submit" type="submit">
            <span>Log in</span>
          </button>
          <p class="auth-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <p class="auth-switch">
          Don&rsquo;t have an account?
          <a href="/register">Create one</a>
        </p>
        <p class="auth-switch">
          <a href="/">&#8592; Back to home</a>
        </p>
      </div>
    </div>

    <script src="/js/auth.js" defer></script>
  </body>
</html>
