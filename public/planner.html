<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Planner — Macrospace</title>
    <script src="/js/shared/theme.js?v=macrospace-20261002"></script>
    <link rel="stylesheet" href="/css/styles.css?v=macrospace-20261002" />
    <script src="/js/shared/vitals.js" defer></script>
  </head>
  <body class="planner-page">
    <div class="shell">
      <div class="dashboard-menu-backdrop" id="dashboard-menu-backdrop" hidden></div>
      <aside class="side" id="dashboard-sidebar" aria-label="Main navigation">
        <div class="side-top">
          <a class="brand" href="/dashboard#/home"><svg class="ms-mark" aria-hidden="true"><use href="/img/icons.svg#logo"></use></svg><span>macrospace</span></a>
          <div class="tt" role="group" aria-label="Color theme">
            <button type="button" data-theme-set="light" aria-pressed="false" title="Light mode"><svg class="ic" aria-hidden="true"><use href="/img/icons.svg#i-sun"></use></svg><span class="sr-only">Light mode</span></button>
            <button type="button" data-theme-set="dark" aria-pressed="false" title="Dark mode"><svg class="ic" aria-hidden="true"><use href="/img/icons.svg#i-moon"></use></svg><span class="sr-only">Dark mode</span></button>
          </div>
        </div>
        <a class="btn btn-primary" href="/planner"><svg class="ic" aria-hidden="true"><use href="/img/icons.svg#i-plus"></use></svg>New plan</a>
        <nav class="side-nav" aria-label="Sections">
          <a href="/dashboard#/home"><svg class="ic" aria-hidden="true"><use href="/img/icons.svg#i-home"></use></svg>Home</a>
          <a href="/dashboard#/customers"><svg class="ic" aria-hidden="true"><use href="/img/icons.svg#i-users"></use></svg>Clients</a>
          <a href="/dashboard#/plans" id="nav-plans-link"><svg class="ic" aria-hidden="true"><use href="/img/icons.svg#i-list"></use></svg>Plans</a>
        </nav>
        <div class="side-foot" id="shell-user"></div>
      </aside>

      <main class="main">
        <div class="mtop">
          <button class="menu-btn" id="dashboard-menu-toggle" type="button" aria-label="Open menu" aria-controls="dashboard-sidebar" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="/img/icons.svg#i-menu"></use></svg></button>
          <a class="brand" href="/dashboard#/home"><svg class="ms-mark" aria-hidden="true"><use href="/img/icons.svg#logo"></use></svg><span>macrospace</span></a>
          <div class="tt" role="group" aria-label="Color theme"><button type="button" data-theme-set="light" aria-pressed="false" title="Light mode"><svg class="ic" aria-hidden="true"><use href="/img/icons.svg#i-sun"></use></svg><span class="sr-only">Light mode</span></button><button type="button" data-theme-set="dark" aria-pressed="false" title="Dark mode"><svg class="ic" aria-hidden="true"><use href="/img/icons.svg#i-moon"></use></svg><span class="sr-only">Dark mode</span></button></div>
          <button class="mtop-out" type="button" data-logout title="Sign out"><svg class="ic" aria-hidden="true"><use href="/img/icons.svg#i-logout"></use></svg><span class="sr-only">Sign out</span></button>
        </div>

        <section class="page workspace">
          <header class="pb-hero setup-intro">
            <h1 id="setup-title">New plan</h1>
            <p>Body data in, ready-meal plan out. Saved to Plans automatically.</p>
          </header>

          <header class="pv-hero" id="plan-view-head" hidden>
            <div>
              <a class="crumb" id="plan-view-back" href="/dashboard#/plans"><svg class="ic" aria-hidden="true"><use href="/img/icons.svg#i-back"></use></svg><span id="plan-view-back-label">Plans</span></a>
              <h1 id="plan-view-title"></h1>
              <p id="plan-view-meta"></p>
            </div>
            <span class="badge" id="plan-view-badge" hidden></span>
          </header>

          <form id="plan-form" class="pb-grid planner" novalidate>
            <div class="box pb-form">
              <div class="pb-line">
                <div class="pb-tag">Client</div>
                <div class="pb-fs pb-fs-client save-customer-picker" id="pre-generation-customer-picker">
                  <div class="field save-customer-picker__field">
                    <label for="customer-choice">Customer</label>
                    <select class="save-action-bar__customer-select" id="customer-choice" name="customerChoice">
                      <option value="general">General</option>
                      <option value="new">New customer</option>
                    </select>
                  </div>
                  <div class="field save-customer-picker__field save-customer-picker__new-name" hidden>
                    <label for="new-customer-name">Customer name</label>
                    <input class="save-action-bar__customer" id="new-customer-name" type="text" name="customerName" placeholder="Full name" autocomplete="off" maxlength="80" />
                  </div>
                  <div class="field">
                    <label for="plan-name">Plan name</label>
                    <input id="plan-name" type="text" name="planName" placeholder="e.g. Cut phase, week 1" autocomplete="off" maxlength="100" required />
                  </div>
                </div>
              </div>

              <div class="pb-line">
                <div class="pb-tag">Body</div>
                <div>
                  <div class="pb-fs pb-fs-body">
                    <div class="field">
                      <span class="lbl" id="sex-label">Sex</span>
                      <div class="seg" role="radiogroup" aria-labelledby="sex-label">
                        <label><input type="radio" name="sex" value="male" checked /><span>Male</span></label>
                        <label><input type="radio" name="sex" value="female" /><span>Female</span></label>
                      </div>
                    </div>
                    <div class="field">
                      <label for="input-age">Age</label>
                      <input id="input-age" type="number" name="age" min="12" max="100" step="1" inputmode="numeric" value="29" required />
                    </div>
                    <div class="field">
                      <label for="input-weight">Weight (kg)</label>
                      <input id="input-weight" type="number" name="weightKg" min="30" max="250" step="0.1" inputmode="decimal" value="78" required />
                    </div>
                    <div class="field">
                      <label for="input-height">Height (cm)</label>
                      <input id="input-height" type="number" name="heightCm" min="120" max="230" step="0.1" inputmode="decimal" value="178" required />
                    </div>
                    <div class="field pb-act-f">
                      <label for="input-activity">Activity</label>
                      <select id="input-activity" name="activityLevel">
                        <option value="sedentary">Sedentary</option>
                        <option value="light">Light</option>
                        <option value="moderate" selected>Moderate</option>
                        <option value="athlete">Athlete / physically demanding</option>
                      </select>
                    </div>
                  </div>
                  <div class="pb-fs pb-fs-body2">
                    <div class="field">
                      <label for="input-body-fat">Body fat % <span class="opt">Optional</span></label>
                      <input id="input-body-fat" type="number" name="bodyFatPercentage" min="3" max="60" step="0.1" inputmode="decimal" placeholder="—" />
                    </div>
                  </div>
                </div>
              </div>

              <div class="pb-line">
                <div class="pb-tag">Plan</div>
                <div class="pb-fs pb-fs-plan">
                  <div class="field">
                    <span class="lbl" id="goal-label">Goal</span>
                    <div class="seg segmented" role="radiogroup" aria-labelledby="goal-label">
                      <label><input type="radio" name="goal" value="maintain" /><span>Maintain</span></label>
                      <label><input type="radio" name="goal" value="lose_weight" checked /><span>Lose</span></label>
                      <label><input type="radio" name="goal" value="gain_weight" /><span>Gain</span></label>
                    </div>
                  </div>
                  <div class="field">
                    <span class="lbl" id="meals-label">Meals a day</span>
                    <div class="seg" role="radiogroup" aria-labelledby="meals-label">
                      <label><input type="radio" name="numberOfMeals" value="3" /><span>3</span></label>
                      <label><input type="radio" name="numberOfMeals" value="4" checked /><span>4</span></label>
                      <label><input type="radio" name="numberOfMeals" value="5" /><span>5</span></label>
                    </div>
                  </div>
                  <div class="field">
                    <label for="input-weeks">Duration</label>
                    <select id="input-weeks" name="durationWeeks">
                      <option value="1">1 week</option>
                      <option value="2">2 weeks</option>
                      <option value="3">3 weeks</option>
                      <option value="4" selected>4 weeks</option>
                      <option value="5">5 weeks</option>
                      <option value="6">6 weeks</option>
                      <option value="7">7 weeks</option>
                      <option value="8">8 weeks</option>
                    </select>
                  </div>
                  <div class="field">
                    <label for="input-start">Starts</label>
                    <input id="input-start" type="date" name="planStartDate" required />
                  </div>
                </div>
              </div>

              <div class="pb-line">
                <div class="pb-tag">Prefs</div>
                <div class="pb-fs pb-fs-more">
                  <div class="field">
                    <label for="input-distribution">Calorie distribution</label>
                    <select id="input-distribution" name="mealDistribution">
                      <option value="balanced" selected>Balanced</option>
                      <option value="breakfast_heavy">Breakfast-heavy</option>
                      <option value="lunch_heavy">Lunch-heavy</option>
                      <option value="dinner_heavy">Dinner-heavy</option>
                    </select>
                  </div>
                  <div class="field preference-field" data-picker="avoidFoods">
                    <span class="lbl">Avoid foods</span>
                    <div class="token-input" role="combobox" aria-haspopup="listbox" aria-expanded="false">
                      <div class="selected-tokens"></div>
                      <input type="search" placeholder="Type to search, Enter to add" autocomplete="off" aria-label="Avoid foods" />
                    </div>
                    <input type="hidden" name="avoidFoods" />
                    <div class="suggestions" role="listbox" hidden></div>
                  </div>
                </div>
              </div>
            </div>

            <aside class="box pb-rail" aria-label="Generate">
              <h2>Ready-meal plan</h2>
              <div class="pb-facts" id="input-chip-row"></div>
              <button class="btn btn-primary generate-button" type="submit">
                <svg class="ic" aria-hidden="true"><use href="/img/icons.svg#i-bolt"></use></svg>
                <span>Generate plan</span>
              </button>
              <p class="pb-note">Saved to Plans automatically</p>
            </aside>
          </form>

          <p id="form-message" class="message" role="status" aria-live="polite"></p>

          <section class="results" aria-live="polite">
            <div id="empty-state" class="empty-state"></div>
            <div id="plan-output" hidden></div>
          </section>
          <div id="save-bar-slot" class="planner-save-slot"></div>
        </section>
      </main>
    </div>

    <template id="summary-template">
      <section class="summary panel">
        <header class="summary__header">
          <h2>Daily totals</h2>
          <div class="summary__controls">
            <label class="manual-mode-switch">
              <input class="manual-mode-toggle" type="checkbox" />
              <i aria-hidden="true"></i>
              <span>Manual mode</span>
            </label>
          </div>
        </header>
        <div class="summary__ranges" aria-label="Allowed daily macro ranges"></div>
        <div class="metrics"></div>
      </section>
    </template>

    <template id="meal-template">
      <article class="meal-card panel">
        <div class="meal-card__header">
          <span class="meal-card__icon" aria-hidden="true"></span>
          <div>
            <div class="meal-card__title-line">
              <h2></h2>
            </div>
            <p class="meal-card__meta"></p>
          </div>
          <span class="meal-card__kcal"><b class="meal-actual-calories"></b> kcal</span>
          <div class="meal-card__actions">
            <button class="meal-cycle-btn meal-cycle-btn--prev" type="button" aria-label="Previous ready meal">‹</button>
            <button class="meal-cycle-btn meal-cycle-btn--next" type="button" aria-label="Next ready meal">›</button>
            <label class="edit-mode-switch">
              <input class="edit-mode-toggle" type="checkbox" />
              <i aria-hidden="true"></i>
              <span>Edit mode</span>
            </label>
          </div>
        </div>
        <div class="meal-card__ranges" aria-label="Allowed meal macro ranges"></div>
        <div class="food-table">
          <div class="food-list-head">
            <span class="food-col-title">Food</span>
            <span class="food-cell food-cell--portion">Portion</span>
            <span class="food-cell food-cell--cal">Calories</span>
            <span class="food-cell food-cell--protein">Protein</span>
            <span class="food-cell food-cell--carb">Carbs</span>
            <span class="food-cell food-cell--fat">Fat</span>
            <span class="food-actions-spacer" aria-hidden="true"></span>
          </div>
          <div class="food-list"></div>
          <div class="meal-card__totals">
            <span class="food-col-title meal-card__totals-label">Meal totals</span>
            <span class="food-cell food-cell--portion"></span>
            <span class="food-cell food-cell--cal meal-metric" data-meal-metric="calories"><strong class="meal-actual-calories"></strong></span>
            <span class="food-cell food-cell--protein meal-metric" data-meal-metric="proteinG"><strong class="meal-actual-proteinG"></strong></span>
            <span class="food-cell food-cell--carb meal-metric" data-meal-metric="carbG"><strong class="meal-actual-carbG"></strong></span>
            <span class="food-cell food-cell--fat meal-metric" data-meal-metric="fatG"><strong class="meal-actual-fatG"></strong></span>
            <span class="food-actions-spacer" aria-hidden="true"></span>
          </div>
        </div>
        <div class="meal-add-tray" hidden>
          <button class="meal-add-food-btn" type="button" aria-label="Add food">
            <span aria-hidden="true">+</span>
          </button>
        </div>
        <div class="meal-action-panel" hidden></div>
      </article>
    </template>

    <script src="/js/shared/planStatus.js?v=macrospace-20261002" defer></script>
    <script src="/js/shared/shell.js?v=macrospace-20261002" defer></script>
    <script src="/js/planner/app.js?v=macrospace-20261002" defer></script>
  </body>
</html>
