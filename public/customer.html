<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer — NutriPlan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      .customer-hero {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px 22px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .customer-hero h2 { font-size: 1.25rem; font-weight: 800; }
      .customer-hero small { color: var(--muted); font-size: 0.85rem; }
      .plans-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .plans-header h3 { font-size: 1rem; font-weight: 700; }
      .plan-list { display: grid; gap: 10px; }
      .plan-row {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .plan-row:hover { border-color: var(--accent); }
      .plan-row-name { font-weight: 700; font-size: 0.95rem; }
      .plan-row-date { color: var(--muted); font-size: 0.78rem; }
      .btn-delete-plan {
        background: none; border: none; color: var(--danger);
        cursor: pointer; font-size: 0.78rem; padding: 4px 8px;
        border-radius: 4px; font-weight: 700; flex-shrink: 0;
      }
      .btn-delete-plan:hover { background: #fff3f2; }
      .empty-plans { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 0.9rem; }

      /* Plan creation panel */
      .create-plan-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 24px;
        margin-top: 28px;
      }
      .create-plan-panel h3 { font-size: 1rem; font-weight: 800; margin-bottom: 16px; }
      .plan-name-row {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .plan-name-row label { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 5px; font-size: 0.86rem; font-weight: 700; }
      .plan-name-row input { min-height: 38px; border: 1px solid var(--line); border-radius: 7px; padding: 0 10px; font: inherit; outline: none; }
      .plan-name-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(18,121,111,0.12); }

      .save-discard-bar {
        display: flex;
        gap: 10px;
        padding: 16px 0 4px;
        border-top: 1px solid var(--line);
        margin-top: 16px;
        flex-wrap: wrap;
      }

      /* Reuse planner styles */
      .planner { display: flex; flex-direction: column; gap: 16px; }
      .workspace { display: grid; grid-template-columns: 380px 1fr; gap: 24px; align-items: start; }
      @media (max-width: 820px) { .workspace { grid-template-columns: 1fr; } }

      /* Viewed saved plan modal */
      .plan-view-overlay {
        position: fixed; inset: 0;
        background: rgba(22,27,31,0.55);
        display: flex; align-items: flex-start; justify-content: center;
        z-index: 200;
        overflow-y: auto;
        padding: 24px 12px;
      }
      .plan-view-overlay[hidden] { display: none; }
      .plan-view-modal {
        background: var(--surface);
        border-radius: 16px;
        width: min(900px, 100%);
        padding: 24px;
        box-shadow: 0 20px 60px rgba(22,27,31,0.2);
      }
      .plan-view-modal-header {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 20px; gap: 12px;
      }
      .plan-view-modal-header h3 { font-size: 1.1rem; font-weight: 800; }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <nav class="planner-nav">
        <div class="planner-nav__brand">
          <p class="eyebrow"><a href="/customers" style="color:var(--accent);text-decoration:none;">Customers</a> / <span id="nav-customer-name">…</span></p>
          <h1 id="nav-title">Customer</h1>
        </div>
        <div class="planner-nav__user" id="planner-nav-user"></div>
      </nav>

      <div class="customer-hero">
        <div>
          <h2 id="customer-fullname">Loading…</h2>
          <small id="customer-username"></small>
        </div>
        <button class="btn btn-primary" id="new-plan-btn" type="button">+ New Plan</button>
      </div>

      <p id="page-message" class="message" role="status" aria-live="polite" style="min-height:1.4em;"></p>

      <div class="plans-header">
        <h3>Saved Plans</h3>
      </div>
      <div id="plan-list" class="plan-list"></div>
      <div id="empty-plans" class="empty-plans" hidden>No plans saved yet. Click "+ New Plan" to create one.</div>

      <!-- Create plan section (hidden until + New Plan clicked) -->
      <div class="create-plan-panel" id="create-plan-panel" hidden>
        <h3>New Plan</h3>
        <div class="plan-name-row">
          <label>
            Plan name
            <input type="text" id="plan-name-input" placeholder="e.g. Cut Phase Week 1" autocomplete="off" />
          </label>
        </div>

        <section class="workspace">
          <form id="plan-form" class="planner" novalidate>
            <section class="panel">
              <h2><span>01</span> Body data</h2>
              <div class="field-grid">
                <label><span>Weight kg</span><input type="number" name="weightKg" min="1" step="0.1" value="80" required /></label>
                <label><span>Height cm</span><input type="number" name="heightCm" min="1" step="0.1" value="175" required /></label>
              </div>
              <label><span>Body fat % <small>optional</small></span><input type="number" name="bodyFatPercentage" min="1" max="69" step="0.1" value="20" /></label>
              <label>
                <span>Activity level</span>
                <select name="activityLevel">
                  <option value="sedentary">Sedentary</option>
                  <option value="light">Light</option>
                  <option value="moderate" selected>Moderate</option>
                  <option value="very_active">Very active</option>
                  <option value="athlete">Athlete</option>
                </select>
              </label>
            </section>
            <section class="panel">
              <h2><span>02</span> Plan setup</h2>
              <div class="segmented" role="radiogroup" aria-label="Goal">
                <label><input type="radio" name="goal" value="maintain" checked /><span>Maintain</span></label>
                <label><input type="radio" name="goal" value="lose_weight" /><span>Lose weight</span></label>
                <label><input type="radio" name="goal" value="lose_weight_aggressive" /><span>Aggressive loss</span></label>
                <label><input type="radio" name="goal" value="gain_weight" /><span>Gain weight</span></label>
              </div>
              <div class="field-grid">
                <label><span>Meals</span>
                  <select name="numberOfMeals">
                    <option value="2">2 meals</option><option value="3" selected>3 meals</option>
                    <option value="4">4 meals</option><option value="5">5 meals</option>
                  </select>
                </label>
                <label><span>Snacks</span>
                  <select name="numberOfSnacks">
                    <option value="0">0 snacks</option><option value="1" selected>1 snack</option><option value="2">2 snacks</option>
                  </select>
                </label>
              </div>
            </section>
            <section class="panel">
              <h2><span>03</span> Preferences</h2>
              <label><span>Diet type</span>
                <select name="dietType">
                  <option value="standard" selected>Standard</option>
                  <option value="vegetarian">Vegetarian</option>
                  <option value="vegan">Vegan</option>
                </select>
              </label>
              <div class="field-grid">
                <label><span>Milk type</span><input type="text" name="milkType" value="skimmed" /></label>
                <label><span>Coffees per day</span><input type="number" name="coffeesPerDay" min="0" step="1" value="1" /></label>
              </div>
              <label class="switch-row">
                <span>Ramadan split</span>
                <input type="checkbox" name="ramadanMode" id="ramadan-toggle" />
              </label>
            </section>
            <button class="generate-button" type="submit"><span>Generate plan</span></button>
            <p id="form-message" class="message" role="status" aria-live="polite"></p>
          </form>

          <section class="results" aria-live="polite">
            <div id="empty-state" class="empty-state">
              <div class="empty-mark" aria-hidden="true"><span></span><span></span><span></span></div>
              <h2>Plan will appear here</h2>
              <p>Fill in the details and click Generate.</p>
            </div>
            <div id="plan-output" hidden></div>

            <div class="save-discard-bar" id="save-discard-bar" hidden>
              <button class="btn btn-primary" id="save-plan-btn" type="button">Save Plan</button>
              <button class="btn btn-ghost" id="discard-plan-btn" type="button">Discard</button>
              <p id="save-message" class="message" style="flex:1;"></p>
            </div>
          </section>
        </section>
      </div>
    </main>

    <!-- View saved plan overlay -->
    <div class="plan-view-overlay" id="plan-view-overlay" hidden>
      <div class="plan-view-modal">
        <div class="plan-view-modal-header">
          <h3 id="plan-view-title">Plan</h3>
          <button class="btn btn-ghost" id="close-plan-view" type="button">Close</button>
        </div>
        <div id="plan-view-content"></div>
      </div>
    </div>

    <template id="summary-template">
      <section class="summary panel">
        <h2>Daily targets</h2>
        <div class="metrics"></div>
      </section>
    </template>

    <template id="meal-template">
      <article class="meal-card panel">
        <div class="meal-card__header">
          <div><h2></h2><p class="meal-card__meta"></p></div>
          <span class="approx-badge" hidden>Approx</span>
        </div>
        <div class="meal-card__totals">
          <div><span>Target</span><strong class="meal-target"></strong></div>
          <div><span>Actual</span><strong class="meal-actual"></strong></div>
          <div><span>Macros</span><strong class="meal-macros"></strong></div>
        </div>
        <div class="food-list-head"><span>Food</span><span>Portion</span><span>Macros</span></div>
        <div class="food-list"></div>
      </article>
    </template>

    <script src="/js/zxcvbn.browser.js" defer></script>
    <script>
      // Auth guard
      (async () => {
        try {
          const res = await fetch('/api/auth/me');
          if (!res.ok) { window.location.replace('/login'); return; }
          const { user } = await res.json();
          document.getElementById('planner-nav-user').innerHTML = `
            <span class="planner-nav__greeting">Hi, ${esc(user.firstname)}</span>
            <a class="btn btn-ghost" href="/customers" style="min-height:36px;font-size:.82rem;">Customers</a>
            <button class="btn btn-ghost" id="logout-btn" style="min-height:36px;font-size:.82rem;">Log out</button>
          `;
          document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.replace('/');
          });
        } catch { window.location.replace('/login'); }
      })();

      const customerId = location.pathname.split('/').pop();
      const pageMessage = document.getElementById('page-message');
      let currentPlanData = null;

      // Load customer info
      (async () => {
        const res = await fetch(`/api/customers/${customerId}`);
        if (!res.ok) { pageMessage.textContent = 'Customer not found.'; return; }
        const { customer } = await res.json();
        document.getElementById('customer-fullname').textContent = `${customer.first_name} ${customer.last_name}`;
        document.getElementById('customer-username').textContent = `@${customer.username}`;
        document.getElementById('nav-customer-name').textContent = `${customer.first_name} ${customer.last_name}`;
        document.getElementById('nav-title').textContent = `${customer.first_name} ${customer.last_name}`;
        document.title = `${customer.first_name} ${customer.last_name} — NutriPlan`;
        loadPlans();
      })();

      async function loadPlans() {
        const res = await fetch(`/api/customers/${customerId}/plans`);
        const { plans } = await res.json();
        renderPlans(plans);
      }

      function renderPlans(plans) {
        const list = document.getElementById('plan-list');
        const empty = document.getElementById('empty-plans');
        list.innerHTML = '';
        if (!plans.length) { empty.hidden = false; return; }
        empty.hidden = true;
        for (const p of plans) {
          const row = document.createElement('div');
          row.className = 'plan-row';
          row.innerHTML = `
            <div>
              <div class="plan-row-name">${esc(p.plan_name)}</div>
              <div class="plan-row-date">${new Date(p.created_at).toLocaleDateString()}</div>
            </div>
            <button class="btn-delete-plan" data-id="${p.plan_id}" type="button">Delete</button>
          `;
          row.addEventListener('click', async (e) => {
            if (e.target.closest('.btn-delete-plan')) return;
            await openPlan(p.plan_id, p.plan_name);
          });
          row.querySelector('.btn-delete-plan').addEventListener('click', async () => {
            if (!confirm(`Delete plan "${p.plan_name}"?`)) return;
            const r = await fetch(`/api/customers/${customerId}/plans/${p.plan_id}`, { method: 'DELETE' });
            if (r.ok) loadPlans();
            else pageMessage.textContent = 'Failed to delete plan.';
          });
          list.append(row);
        }
      }

      async function openPlan(planId, planName) {
        const res = await fetch(`/api/customers/${customerId}/plans/${planId}`);
        const { plan } = await res.json();
        document.getElementById('plan-view-title').textContent = plan.plan_name;
        renderPlanView(plan.plan_data, document.getElementById('plan-view-content'));
        document.getElementById('plan-view-overlay').hidden = false;
      }

      document.getElementById('close-plan-view').addEventListener('click', () => {
        document.getElementById('plan-view-overlay').hidden = true;
      });
      document.getElementById('plan-view-overlay').addEventListener('click', (e) => {
        if (e.target === document.getElementById('plan-view-overlay'))
          document.getElementById('plan-view-overlay').hidden = true;
      });

      // ── New plan creation — redirect to interactive planner ──────────────────
      document.getElementById('new-plan-btn').addEventListener('click', () => {
        const name = document.getElementById('customer-fullname').textContent.trim();
        window.location.href = `/planner?customerId=${customerId}&customerName=${encodeURIComponent(name)}`;
      });

      document.getElementById('discard-plan-btn').addEventListener('click', () => {
        document.getElementById('create-plan-panel').hidden = true;
        document.getElementById('plan-output').hidden = true;
        document.getElementById('empty-state').hidden = false;
        document.getElementById('save-discard-bar').hidden = true;
        document.getElementById('plan-name-input').value = '';
        currentPlanData = null;
      });

      const form = document.getElementById('plan-form');
      const formMessage = document.getElementById('form-message');
      const submitBtn = form.querySelector('button[type="submit"]');
      const ramadanToggle = document.getElementById('ramadan-toggle');
      const mealsSelect = form.elements.numberOfMeals;
      const snacksSelect = form.elements.numberOfSnacks;

      ramadanToggle.addEventListener('change', () => {
        mealsSelect.disabled = ramadanToggle.checked;
        snacksSelect.disabled = ramadanToggle.checked;
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        formMessage.textContent = '';
        submitBtn.disabled = true;
        submitBtn.querySelector('span').textContent = 'Generating…';
        try {
          const fd = new FormData(form);
          const body = {
            weightKg: fd.get('weightKg'),
            heightCm: fd.get('heightCm'),
            bodyFatPercentage: fd.get('bodyFatPercentage'),
            activityLevel: fd.get('activityLevel'),
            goal: fd.get('goal'),
            numberOfMeals: fd.get('numberOfMeals'),
            numberOfSnacks: fd.get('numberOfSnacks'),
            dietType: fd.get('dietType'),
            allergies: [],
            dislikes: [],
            milkType: fd.get('milkType'),
            coffeesPerDay: fd.get('coffeesPerDay'),
            ramadanMode: fd.has('ramadanMode'),
          };
          const res = await fetch('/api/generate-plan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const payload = await res.json();
          if (!res.ok) throw new Error(payload.error || 'Could not generate plan.');
          currentPlanData = payload;
          renderPlanView(payload, document.getElementById('plan-output'));
          document.getElementById('plan-output').hidden = false;
          document.getElementById('empty-state').hidden = true;
          document.getElementById('save-discard-bar').hidden = false;
        } catch (err) {
          formMessage.textContent = err.message;
        } finally {
          submitBtn.disabled = false;
          submitBtn.querySelector('span').textContent = 'Generate plan';
        }
      });

      document.getElementById('save-plan-btn').addEventListener('click', async () => {
        const planName = document.getElementById('plan-name-input').value.trim();
        const saveMsg = document.getElementById('save-message');
        saveMsg.textContent = '';
        if (!planName) { saveMsg.textContent = 'Enter a plan name above first.'; return; }
        if (!currentPlanData) { saveMsg.textContent = 'Generate a plan first.'; return; }

        const fd = new FormData(form);
        const body = {
          planName,
          weightKg: fd.get('weightKg'),
          heightCm: fd.get('heightCm'),
          bodyFatPercentage: fd.get('bodyFatPercentage'),
          activityLevel: fd.get('activityLevel'),
          goal: fd.get('goal'),
          numberOfMeals: fd.get('numberOfMeals'),
          numberOfSnacks: fd.get('numberOfSnacks'),
          dietType: fd.get('dietType'),
          allergies: [],
          dislikes: [],
          milkType: fd.get('milkType'),
          coffeesPerDay: fd.get('coffeesPerDay'),
          ramadanMode: fd.has('ramadanMode'),
        };

        const res = await fetch(`/api/customers/${customerId}/plans`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) { saveMsg.textContent = data.error; return; }

        document.getElementById('create-plan-panel').hidden = true;
        document.getElementById('plan-output').hidden = true;
        document.getElementById('empty-state').hidden = false;
        document.getElementById('save-discard-bar').hidden = true;
        document.getElementById('plan-name-input').value = '';
        currentPlanData = null;
        loadPlans();
        pageMessage.textContent = `Plan "${planName}" saved.`;
        setTimeout(() => { pageMessage.textContent = ''; }, 3000);
      });

      // ── Simple read-only plan renderer ───────────────────────────────────────
      function renderPlanView(plan, container) {
        container.innerHTML = '';
        const sep = '·';
        // Summary
        const summary = document.createElement('section');
        summary.className = 'summary panel';
        summary.innerHTML = `<h2>Daily targets</h2><div class="metrics"></div>`;
        const metrics = summary.querySelector('.metrics');
        for (const [key, label, unit] of [['calories','Calories','kcal'],['proteinG','Protein','g'],['carbG','Carbs','g'],['fatG','Fat','g']]) {
          const m = document.createElement('div');
          m.className = 'metric';
          m.innerHTML = `<span>${label}</span><strong>${fmt(plan.dailyTargets[key])}</strong><small>${unit}</small>`;
          metrics.append(m);
        }
        container.append(summary);

        // Meals
        for (const meal of plan.meals) {
          const totals = meal.totals;
          const card = document.createElement('article');
          card.className = 'meal-card panel';
          card.innerHTML = `
            <div class="meal-card__header">
              <div><h2>${esc(meal.name)}</h2><p class="meal-card__meta">${meal.items.length} foods</p></div>
            </div>
            <div class="meal-card__totals">
              <div><span>Target</span><strong>${fmt(meal.target.calories)} kcal</strong></div>
              <div><span>Actual</span><strong>${fmt(totals.calories)} kcal</strong></div>
              <div><span>Macros</span><strong>P ${fmt(totals.proteinG)}g ${sep} C ${fmt(totals.carbG)}g ${sep} F ${fmt(totals.fatG)}g</strong></div>
            </div>
            <div class="food-list-head"><span>Food</span><span>Portion</span><span>Macros</span></div>
            <div class="food-list" id="food-list-${meal.name.replace(/\s/g,'-')}"></div>
          `;
          const fl = card.querySelector('.food-list');
          for (const item of meal.items) {
            const f = item.food;
            const factor = item.quantityG / 100;
            const cal = f.caloriesPer100g * factor;
            const p = f.proteinGPer100g * factor;
            const c = f.carbGPer100g * factor;
            const fat = f.fatGPer100g * factor;
            const row = document.createElement('div');
            row.className = 'food-item';
            row.innerHTML = `
              <div class="food-main">
                <div class="food-title"><div class="food-name">${esc(f.name)}</div></div>
                <div class="food-gram-wrap"><span style="font-weight:700;font-size:.88rem;">${item.quantityG}g</span></div>
                <div class="food-macros">
                  <strong class="item-kcal">${fmt(cal)} kcal</strong>
                  <span class="item-p">P ${fmt(p)}g</span>
                  <span class="item-c">C ${fmt(c)}g</span>
                  <span class="item-f">F ${fmt(fat)}g</span>
                </div>
              </div>
            `;
            fl.append(row);
          }
          container.append(card);
        }
      }

      function fmt(v) { return Number(v).toFixed(0); }
      function esc(str) {
        return String(str || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }
    </script>
  </body>
</html>
