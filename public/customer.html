<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Customer — Pinch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="dashboard-page customer-page">
    <main class="app-shell dashboard-frame">
      <nav class="planner-nav">
        <div class="planner-nav__brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 4 13c0-5 4-9 12-10 1 8-2 13-7 13" />
              <path d="M7 14c2-1 4-1 7-4" />
            </svg>
          </span>
          <span>
            <strong>Pinch</strong>
            <small>Customer</small>
          </span>
        </div>
        <div class="planner-nav__user" id="planner-nav-user"></div>
      </nav>

      <div class="dashboard-app-body">
        <aside class="dashboard-sidebar" aria-label="Dashboard navigation">
          <a class="dashboard-side-link" href="/dashboard">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m3 10 9-7 9 7" />
              <path d="M5 10v10h14V10" />
              <path d="M9 20v-6h6v6" />
            </svg>
            Home
          </a>
          <a class="dashboard-side-link is-active" href="/dashboard#customers-title">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Customers
          </a>
          <a class="dashboard-side-link" href="/dashboard#general-title">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z" />
              <path d="M14 3v5h5" />
            </svg>
            Plans
          </a>
          <span class="dashboard-side-divider" aria-hidden="true"></span>
          <a class="dashboard-side-link" href="/planner">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14" />
              <path d="M5 12h14" />
            </svg>
            New plan
          </a>
        </aside>

        <section class="dashboard-shell customer-shell" aria-labelledby="customer-title">
          <a class="dashboard-back-link" href="/dashboard#customers-title">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m15 18-6-6 6-6" />
            </svg>
            Back to dashboard
          </a>
          <section class="dashboard-panel-card customer-header-card">
            <span class="dashboard-icon-square" data-tone="protein" aria-hidden="true"></span>
            <div>
              <h1 id="customer-title">Customer</h1>
              <p id="customer-subtitle">Plans</p>
            </div>
          </section>

          <section class="dashboard-section dashboard-panel-card" aria-labelledby="customer-plans-title">
            <header class="dashboard-section__header">
              <h2 id="customer-plans-title">Assigned plans</h2>
            </header>
            <div class="dashboard-plan-grid" id="customer-plans"></div>
          </section>

          <p id="customer-message" class="message" role="status" aria-live="polite"></p>
        </section>
      </div>
    </main>

    <script src="/js/customer.js" defer></script>
  </body>
</html>
