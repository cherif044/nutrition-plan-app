name: Weekly backup

# Weekly logical backup that lives outside Neon and outside anything the
# app's runtime database role can reach (remediation P1.5). The dump and the
# Firebase user export are encrypted to a public key before upload, so the
# artifact is unreadable without the offline private key.
#
# Required repository secrets:
#   BACKUP_DATABASE_URL     connection string for a READ-ONLY role (not the app role)
#   BACKUP_GPG_PUBLIC_KEY   ASCII-armored public key to encrypt to
# Optional (Firebase Auth users export):
#   FIREBASE_BACKUP_SA_JSON service account JSON with Firebase Authentication Viewer
#   FIREBASE_PROJECT_ID

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_BACKUP_SA_JSON != '' }}
    steps:
      - name: Import encryption key
        env:
          KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
        run: |
          echo "$KEY" | gpg --batch --import
          echo "RECIPIENT=$(gpg --list-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          docker run --rm -e DATABASE_URL postgres:17 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL"' > db.dump
          test -s db.dump
          gpg --batch --trust-model always --encrypt --recipient "$RECIPIENT" --output db.dump.gpg db.dump
          rm db.dump

      - name: Export Firebase Auth users
        if: ${{ env.HAS_FIREBASE == 'true' }}
        env:
          SA_JSON: ${{ secrets.FIREBASE_BACKUP_SA_JSON }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          umask 077
          echo "$SA_JSON" > sa.json
          GOOGLE_APPLICATION_CREDENTIALS=sa.json npx --yes firebase-tools@13 auth:export users.json --format=json --project "$PROJECT"
          rm sa.json
          gpg --batch --trust-model always --encrypt --recipient "$RECIPIENT" --output users.json.gpg users.json
          rm users.json

      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: '*.gpg'
          retention-days: 90
          if-no-files-found: error
